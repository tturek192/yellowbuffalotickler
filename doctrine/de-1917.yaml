# German defensive doctrine of 1917 (the defensive battle in depth, Eingreif divisions).
# Every parameter is a Param with a plain-language description (tables/README.md): sourced where a manual or an
# official history gives it, otherwise an estimate with its reasoning; behaviour coefficients are calibrated estimates
# for Plan 4. Research notes: docs/research/model/doctrine.md.
id: de-1917
title: German 1917 defensive doctrine (defence in depth and the counter-attack)
sources:
  nicholson-1962:
    title: 'Canadian Expeditionary Force 1914-1919: Official History of the Canadian Army in the First World War'
    author: G. W. L. Nicholson
    year: 1962
    url: https://publications.gc.ca/collections/collection_2009/forces/DA3-4462E.pdf
    tier: official
    note: the Vimy preparations and rehearsals (p. 250), the barrage (p. 253); the German defensive principles of December 1916 (pp.
      239-240) and the Eingreif divisions (p. 306)
  boh-1917-1:
    title: 'Military Operations, France and Belgium, 1917: The German Retreat to the Hindenburg Line and the Battles of Arras'
    author: Cyril Falls
    year: 1940
    url: https://archive.org/details/in.ernet.dli.2015.210683
    tier: official
    note: German tactics and the Eingreif division (p. 241); the dug-outs on Vimy Ridge and the expectation of immediate counter-attacks
      (p. 316); Gegenstoss and Gegenangriff (p. 523 n.)
  ss143-1917:
    title: Instructions for the Training of Platoons for Offensive Action, 1917 (S.S. 143), U.S. War Department reprint
    author: General Staff, G.H.Q. (British Armies in France)
    year: 1917
    url: https://archive.org/details/instructionsfort00washrich
    tier: primary
    note: 'the platoon and company of February 1917: organization (p. 9), ammunition and bombs carried (p. 10), moppers-up (p. 16),
      formations in two waves (Appendixes I and III, pp. 20-22)'
  german-handbook-1917:
    title: Handbook of the German Army in War, January 1917
    author: General Staff, War Office (Great Britain)
    year: 1917
    url: https://archive.org/details/hndbkgermanarmy-1917jan
    tier: primary
    note: 'British intelligence handbook: the infantry battalion (p. 30) and its war establishment (p. 39), the machine-gun companies
      (pp. 49-50)'
  german-handbook-1918:
    title: Handbook of the German Army in War, April 1918
    author: General Staff, War Office (Great Britain)
    year: 1918
    url: https://archive.org/details/hndbk-german-army-1918apr
    tier: primary
    note: the Prussian War Ministry order of 12 March 1917 on battalion strength and light machine guns (p. 44); light machine guns
      issued by the end of 1917 (p. 55)
  survey-german-tactics-1918:
    title: A Survey of German Tactics, 1918
    author: General Headquarters, American Expeditionary Forces
    year: 1918
    url: https://archive.org/details/surveyofgermanta00unitrich
    tier: primary
    note: 'translations of captured German orders of 1918: the sector garrison and its counter-attack companies (p. 32), counter-attacks
      (pp. 35-36), the rate of advance behind a barrage (p. 18). A year later than Vimy, so a lead for 1917 practice'
common:
  baseMorale:
    value: 0.8
    estimate: 'morale runs from 0 to 1. A company starts at about 0.8; with lossShock 1, losing a third of its men in a short time takes
      it below 0.5 and losing half takes it near 0.3. Both armies'' infantry in April 1917 are taken as steady troops: 0.8, before leader
      and training adjustments; what the bombardment did to the German garrisons is the bombardment model''s, not the doctrine''s'
    description: Morale a company starts the battle with, before leader and training adjustments (0 to 1).
    calibrated: true
  goToGround:
    value: 0.5
    estimate: 'morale runs from 0 to 1. A company starts at about 0.8; with lossShock 1, losing a third of its men in a short time takes
      it below 0.5 and losing half takes it near 0.3. an attack usually went to ground when a company had lost about a third of its
      men in a few minutes: 0.5'
    description: Morale below which a company goes to ground.
    calibrated: true
  fallBack:
    value: 0.35
    estimate: 'morale runs from 0 to 1. A company starts at about 0.8; with lossShock 1, losing a third of its men in a short time takes
      it below 0.5 and losing half takes it near 0.3. a company that had lost about half its men in a short time could rarely be held:
      0.35'
    description: Morale below which a company falls back.
    calibrated: true
  surrender:
    value: 0.15
    estimate: 'morale runs from 0 to 1. A company starts at about 0.8; with lossShock 1, losing a third of its men in a short time takes
      it below 0.5 and losing half takes it near 0.3. only a company close to breaking, with the enemy within bombing range, gives up:
      0.15'
    description: Morale below which a company with an enemy close by surrenders.
    calibrated: true
  pinSuppression:
    value: 0.7
    estimate: suppression runs from 0 to 1; above 0.7 men under fire stay down whatever their morale
    description: Suppression above which a company is pinned.
    calibrated: true
  lossShock:
    value: 1.0
    estimate: 'morale falls by the share of the company lost in the step: losing a tenth of its men costs a tenth of its morale. The
      simplest proportional rule, for Plan 4 to calibrate'
    description: Morale lost per fraction of the company that becomes a casualty in a step.
    calibrated: true
  suppressedDrain:
    value: 0.3
    estimate: an hour pinned under full suppression wears a company's morale down by about a third of its starting value
    description: Morale lost per hour at full suppression.
    calibrated: true
  isolationDrain:
    value: 0.1
    estimate: 'a company cut off from its headquarters loses morale slowly: about a tenth an hour'
    description: Morale lost per hour while cut off from its headquarters.
    calibrated: true
  recoveryPerHour:
    value: 0.2
    estimate: 'out of fire a company recovers, but more slowly than it was shaken: back from 0.4 to its start in about two hours'
    description: Morale regained per hour when no fire is coming in.
    calibrated: true
  leaderMoraleStep:
    value: 0.03
    estimate: leader ratings run from 1 to 5 around 3, so the best and worst leaders move starting morale by 0.06 either way, less than
      a tenth of its range
    description: Starting morale gained per point of the leader's morale rating above 3.
    calibrated: true
  closeRangeM:
    value: 50
    estimate: 'bomb and bayonet range: a hand grenade is thrown some 30 m and a rush covers the rest'
    description: Distance in metres within which an enemy counts as close.
    calibrated: true
  quietStepMin:
    value: 10
    estimate: 'a numerical choice, not behaviour: 10-minute steps while nothing is in contact keep a four-day run fast; contact and
      barrages switch to 2-minute steps'
    description: Minutes per simulation step while nothing is in contact.
  baseOrderDelayMin:
    value: 15
    estimate: a headquarters reads a report, decides and writes an order in some 10 to 30 minutes; 15, before the leader's orderSpeed
      rating and the channel's delay
    description: Minutes a headquarters takes to turn a report into an order.
    calibrated: true
  marchKmPerHour:
    value: 4
    estimate: about 2.5 miles an hour for formed infantry with halts on roads and tracks behind the front, slower than the 3 miles an
      hour of a road march in peace; no rate was found in the sources read
    description: Marching speed of reserves in kilometres per hour.
    calibrated: true
  deployMin:
    value: 30
    estimate: a battalion arriving in column needs about half an hour to get its companies into their places and its orders out before
      it can attack
    description: Minutes a reserve needs to deploy from column into line.
    calibrated: true
  reportEveryMin:
    value: 30
    estimate: battalions sent situation reports to brigade about every half hour in battle, and whenever something happened
    description: Minutes between routine reports to the next headquarters.
    calibrated: true
  fatiguePerKm:
    value: 0.02
    estimate: 'a man carrying 60 lb or more through mud and shell holes tires quickly: 10 km of it brings fatigue to 0.2 on a scale
      of 0 to 1'
    description: Fatigue gained per kilometre marched or advanced.
    calibrated: true
  fatigueRecoveryPerHour:
    value: 0.05
    estimate: 'resting in a trench or a shelter, men recover slowly: four hours take off 0.2'
    description: Fatigue lost per hour of rest.
    calibrated: true
ncoPenalty:
  rehearsed:
    value: 0.1
    estimate: 'German doctrine of December 1916 made the group of about eleven men under an N.C.O. "the infantry''s tactical unit",
      its leader free "within certain limits, to retire in any direction before strong enemy fire" (nicholson-1962 p. 240); a German
      company that had rehearsed a set task (a counter-attack, say) loses as little as a rehearsed British one: a tenth'
    description: Share of speed and fire lost by a company with no officers that had rehearsed the attack.
    calibrated: true
  standard:
    value: 0.3
    estimate: 'a company that has not rehearsed its task and loses its officers hesitates and loses touch: about a third of its speed
      and fire, three times the rehearsed penalty'
    description: Share of speed and fire lost by a company with no officers and no special rehearsal.
    calibrated: true
companyDefaults:
  officers:
    value: 3
    estimate: 'the war establishment of a company was 5 officers (german-handbook-1917 p. 39), but "a company [is now usually commanded]
      by a subaltern" (p. 39) and companies in the line had fewer: 3'
    description: Officers in a company when the scenario does not say.
  lewisGuns:
    value: 1
    estimate: 'the German light machine gun, the 08/15, fired as companyWeapons.lightMg (mg08-15); the count keeps the scenario''s field
      name. "The issue of the ''08/''15 light machine gun began in March, 1917, on the scale of 3 to every infantry company" (german-handbook-1918
      p. 61; the order of 12 March 1917, p. 44), and "By the end of 1917 every infantry company on the Western Front had received 3"
      (p. 55). In April 1917 the issue had only begun: 1'
    description: 'Light machine guns (the side''s, fired as companyWeapons.lightMg: here the 08/15) in a company when the scenario does
      not say.'
  machineGuns:
    value: 1.5
    estimate: 'every infantry regiment has three machine-gun companies, one attached to each battalion (german-handbook-1917 p. 49),
      of 6 guns (p. 50); the scenario has no machine-gun companies, so the battalion''s 6 guns are spread over its four rifle companies:
      1.5'
    description: Machine guns in a company when the scenario does not say.
  bombsPerMan:
    value: 2
    estimate: 'taken as the British figure (2, ss143-1917 p. 10): no German figure was found in the sources read, and both armies fought
      for trenches with the bomb'
    description: Grenades each man carries when the scenario does not say.
  strength:
    value: 187
    estimate: the Prussian War Ministry order of 12 March 1917 set a battalion at 750 other ranks (german-handbook-1918 p. 44), a quarter
      each to four companies; the earlier war establishment was 259 a company (german-handbook-1917 p. 39)
    description: Men in a company when the scenario does not say.
  companiesPerBattalion:
    value: 4
    source: german-handbook-1917
    page: '30'
    note: '"Each battalion is divided into 4 companies and a machine gun company"'
    description: Companies in a battalion when the scenario does not say.
  battalionsPerDivision:
    value: 9
    source: german-handbook-1917
    page: '30'
    note: '"the great majority of German Divisions have now been organized on the 3-regiment basis, the three infantry regiments (9
      battalions)"'
    description: Battalions in a division when the scenario gives the division none (an off-map reserve division, say).
  dugoutDepthM:
    value: 6.1
    estimate: 'twenty feet, the shallow end of the deep mined dug-outs: on Vimy Ridge "the main German dug-outs and tunnels twenty to
      fifty feet down in the chalk" (boh-1917-1 p. 316). A garrison the scenario gives no depth for is taken to have the shallowest
      of them; Vimy''s garrisons each have their own depth'
    description: Depth in metres of the dugouts a garrison company shelters in when the scenario does not say.
  roundsPerRifle:
    value: 150
    source: german-handbook-1917
    page: '44'
    note: 'the distribution of ammunition in the field, rounds per man: "Carried on the soldier ... 150"; another 70 a man are in the
      company ammunition wagon, behind the line'
    description: Rounds of small-arms ammunition each rifleman carries into the battle (the company's load, with its light and heavy
      machine guns' rounds, is what its fire uses up).
  roundsPerLightMg:
    value: 4000
    estimate: 'half the heavy gun''s 8,000 rounds on its limber (german-handbook-1917 p. 52): the 08/15 had no limber and its team
      carried its belt boxes by hand, so less, but a trench garrison kept boxes at the gun. Order of magnitude, for Plan 4 to check'
    description: Rounds each light machine gun (the side's, fired as companyWeapons.lightMg) has with it in the battle.
  roundsPerMg:
    value: 8000
    source: german-handbook-1917
    page: '52'
    note: '"The amount now carried appears to be - 8,000 rounds per gun on the limbered gun wagons", with 1,300 more on the ammunition
      wagons; the limbered wagons'' rounds come forward with the gun'
    description: Rounds each machine gun has with it in the battle.
companyWeapons:
  rifle: rifle
  lightMg: mg08-15
  mg: mg08
attack:
  followDistanceM:
    value: 0
    estimate: 'kept from the Plan 1 stub: German counter-attacks are not modelled as following a creeping barrage; the engine reads
      this value, so it is unchanged (the golden record would move)'
    description: How many metres behind the creeping barrage the attackers stay.
    calibrated: true
  maxAdvanceMPerMin:
    value: 40
    estimate: kept from the Plan 1 stub (the engine reads it). A German order of 1918 gives "Two hundred meters in four minutes, synchronized
      with the rolling barrage" (survey-german-tactics-1918 p. 18), 50 m a minute; a counter-attack over broken ground goes slower
    description: Fastest walking pace of an advancing company in metres per minute.
    calibrated: true
  startJitterMin:
    value: 0
    estimate: kept from the Plan 1 stub (the engine reads it)
    description: Each company starts up to this many minutes late, at random.
    calibrated: true
  speedJitterFrac:
    value: 0
    estimate: kept from the Plan 1 stub (the engine reads it)
    description: Each company's speed varies at random by up to this fraction.
    calibrated: true
  waveSpacingM:
    value: 50
    estimate: 'German counter-attack troops "advance in waves" (survey-german-tactics-1918 p. 35); no distance is given, so the British
      figure''s lower end: 50'
    description: Distance in metres between successive waves of an attack.
    calibrated: true
  mopUpRateMenPerMin:
    value: 3
    estimate: 'taken as the British figure: no German source on clearing dugouts was found, and German troops retaking a trench face
      the same stairways as British moppers-up, who "work in pairs" and "guard the entrances to dugouts" (ss143-1917 p. 16): about 3
      men a minute'
    description: Men a mopping-up company clears out of dugouts per minute.
    calibrated: true
  stallToleranceMin:
    value: 30
    estimate: a company that has stood still for half an hour has lost its barrage by 900 m and counts as stalled
    description: Minutes an attack can stand still before it counts as stalled.
    calibrated: true
  minAttackRatio:
    value: 1.5
    estimate: a commander orders a fresh attack with at least half as many men again as the defenders in front; the capture itself needs
      captureRatio (3 to 1) locally, which the barrage and surprise give
    description: Attackers to defenders required before a commander orders a new attack.
    calibrated: true
  trainingBonusRehearsed:
    value: 0.1
    estimate: 'taken as the British figure: no German source on the effect of rehearsal was found, and a set task practised beforehand
      steadies any troops as it did the Canadians (nicholson-1962 p. 250): a tenth of the morale range'
    description: Starting morale added for a company that rehearsed the attack.
    calibrated: true
  ammoReserveFrac:
    value: 0.2
    estimate: 'taken as the British figure: no German figure was found, and a counter-attacking company has the same need to keep rounds
      back against the next attack: a fifth'
    description: Share of ammunition a company keeps back and will not fire away.
    calibrated: true
defence:
  emergeMin:
    value: 3
    estimate: 'the main German dug-outs on Vimy Ridge were "twenty to fifty feet down in the chalk" (boh-1917-1 p. 316): a garrison
      has to climb 6-15 m of stairs with rifles and machine guns once its sentries call; 1 to 5 minutes, 3. BOH: "The attacking infantry
      could not hope to reach and block the entrances before the garrisons turned out unless tactical surprise were obtained" (p. 316)'
    description: Minutes after a barrage lifts before the garrison is out of its dugouts and firing.
    calibrated: true
  trappedSurrenderFrac:
    value: 0.6
    estimate: 'a garrison caught below ground with bombers at the stairheads mostly gave up: on the 3rd Canadian Division''s front "a
      like number of the enemy were captured shortly afterwards in the dug-outs" (boh-1917-1 p. 325); some fought on or hid. 0.6, the
      rest left as dugout points to be cleared'
    description: Share of a garrison that surrenders when attackers reach it before it emerges.
    calibrated: true
  localCounterAttackDelayMin:
    value: 5
    estimate: 'the form-up and launch only, counted from when the battalion''s picture shows the loss: the report''s journey is the
      channels'' and the approach to the lost trench is simulated movement after this delay. German doctrine called for "immediate counter-attacks
      ... to recover any ground lost" (boh-1917-1 p. 316), the Gegenstoss "frequently carried out in the course of the battle" as opposed
      to the deliberate Gegenangriff (p. 523 n.), before the enemy can "rest or install himself" (survey-german-tactics-1918 p. 35),
      by a counter-attack company that lies close behind with its task known (p. 32). A few minutes to come up from its shelters, form
      up and go: 5'
    description: Minutes, once the reserve's headquarters knows a segment is lost, for the local reserve to form up and go in; its approach
      is simulated movement after this delay.
    calibrated: true
  divisionalCounterAttackDelayMin:
    value: 30
    estimate: 'the form-up and launch only, counted from when the reserves have arrived and deployed: their order''s journey, their
      march and their deployment are counted separately. The counter-attack (Eingreif) divisions were to strike "the enemy in the midst
      of his assault" (nicholson-1962 p. 306) from "close behind the Second Line" (p. 240), so they go in from the march: orders to
      the battalions and the artillery''s support arranged in about half an hour. The deliberate Gegenangriff, prepared over days (boh-1917-1
      p. 523 n.), is not this. Where a battle''s reserves actually stood is the scenario''s, not the doctrine''s'
    description: Minutes, once the reserves have arrived and deployed, before the divisional counter-attack goes in; their march and
      deployment are counted separately (marchKmPerHour, deployMin).
    calibrated: true
  counterAttackMinRatio:
    value: 0.75
    estimate: 'German counter-attacks relied on fresh troops striking tired ones: "their fresh troops hold a great advantage over the
      tired troops of the attacker" (survey-german-tactics-1918 p. 35); so they went in without numerical superiority, at three to four'
    description: Defenders to attackers needed before a counter-attack is ordered.
    calibrated: true
  commitReserveWhenLostFrac:
    value: 0.25
    estimate: the elastic defence expected to lose ground in the forward zone and won it back by counter-attack (nicholson-1962 pp.
      239-240); the reserve goes in once a quarter of a sector is lost
    description: Share of a sector's segments that must be lost before its reserve is committed.
    calibrated: true
  counterAttackMinMen:
    value: 35
    estimate: 'about a platoon: each German company "is divided into 3 platoons (Züge)" (german-handbook-1917 p. 80), and at the "seventy or
      eighty" rifles a company had at Vimy (boh-1917-1 p. 317) a platoon is 25-40 men; fewer than that cannot retake a trench, whatever the
      odds against an empty one. A judgement, for Plan 4 to calibrate'
    description: Fewest men a headquarters sends on a counter-attack, whatever the odds it believes it faces.
    calibrated: true
  counterAttackRetryMin:
    value: 60
    estimate: 'a counter-attack that has not retaken its trench is tried again once fresh men can be gathered and the news of the first has
      come back; the immediate counter-attack (Gegenstoss) was "frequently carried out in the course of the battle" (boh-1917-1 p. 523
      n.). An hour, a judgement for Plan 4 to calibrate'
    description: Minutes after ordering a counter-attack before its headquarters may order another on the same ground, if it is still lost.
    calibrated: true
