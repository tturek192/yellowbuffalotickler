# Every other rate and radius the combat model uses. Calibrated estimates with their reasoning, except where a
# source or a calculation gives the number. Notes: docs/research/model/tables.md.
effects:
  killedFrac:
    value: 0.25
    estimate: 'the Canadian Army lost 51,748 killed in action or died of wounds among 232,494 casualties of all kinds (nicholson-1962
      p. 535), 22 per cent; the total includes sick and injured, so the battle share of killed is a little higher: 0.25'
    description: Share of casualties that are killed (or die of wounds) rather than wounded.
    calibrated: true
  officerExposure:
    value: 1.5
    estimate: officers led from the front and were picked out; an officer is taken to be half again as likely to be hit as a man of
      his company. Order of magnitude; Plan 4 can check it against the officer shares of the casualty returns
    description: How much more likely than a rifleman an officer is to be hit (multiplies officers / men).
    calibrated: true
  densityRefMen:
    value: 30
    estimate: 'about a platoon: SS 143 sets a platoon at 28 to 44 other ranks (ss143-1917 p. 9). A burst or a traverse finds as many
      men in any group at least that large; smaller groups, a section or a gun team, offer proportionally fewer'
    description: Men in a target group at which fire reaches full effect; smaller groups are hit proportionally less.
    calibrated: true
  suppressionHalfLifeMin:
    value: 5
    estimate: men who have gone to ground under fire take some minutes to get up and go on once it stops; half in 5 minutes, nearly
      all in 15
    description: Minutes for suppression to halve when no fire is coming in.
    calibrated: true
  cutPerRound:
    value: 20
    estimate: a shrapnel or graze-fuzed burst on a belt of wire breaks the strands over a patch of about 4 m by 5 m; so a 20 m deep
      belt needs about one round per metre of front to be 63 per cent cut. Allenby's planners reckoned on cutting 40 per cent of the
      wire in a short bombardment (boh-1917-1 p. 179), the same order
    description: Square metres of wire belt cut by one shell.
    calibrated: true
  damagePerRound:
    value: 5
    estimate: a medium or heavy shell bursting in or beside a trench blows in some 3 to 6 m of it; so one round per 5 m wrecks 63 per
      cent of a trench
    description: Metres of trench wrecked by one shell.
    calibrated: true
  dugoutPerRound:
    value: 10
    estimate: 'a heavy shell with a delay fuze breaks a dugout only by a near-direct hit over it, and the deeper the dugout the less
      it does: at 10 m depth one round breaks 1 m of a segment''s dugouts, at 5 m two. Low on purpose: "no amount of metal or explosive
      from above could destroy the main German dug-outs ... twenty to fifty feet down in the chalk" (boh-1917-1 p. 316)'
    description: Square metres of dugout (segment length times depth) broken by one heavy shell.
    calibrated: true
  safeDepthM:
    value: 3
    estimate: 'the share of a garrison exposed to bombardment is 1 - d / (d + safeDepthM): 3 m of cover halves it, a deep chalk dugout
      of 6-15 m (20 to 50 ft, boh-1917-1 p. 316) leaves a third to a sixth exposed, for the men who must keep sentries and come up'
    description: Dugout depth in metres at which a garrison is half as exposed to bombardment as one with no dugouts.
    calibrated: true
  lossRate:
    value: 0.5
    estimate: a garrison without dugouts in a trench that is completely wrecked loses about half its men killed or wounded over a long
      bombardment; the rest find shell holes or slip away
    description: Share of a garrison lost in a trench that is completely wrecked and has no dugouts.
    calibrated: true
  batteryRecoveryHalfLifeMin:
    value: 120
    estimate: 'a battery silenced by counter-battery fire and gas must replace men, horses and ammunition and repair or move its guns:
      hours, not minutes. Gassed horses kept German batteries from moving or bringing up ammunition at Vimy (boh-1917-1 p. 320)'
    description: Minutes for a silenced battery to recover half of its lost fire.
    calibrated: true
  mudSpeedFactor:
    value: 0.6
    estimate: deep mud slows a loaded man to about half his pace; "the heavy mud slackened their pace" (boh-1917-1 p. 333)
    description: Walking-speed multiplier on mud.
    calibrated: true
  wireSpeedFactor:
    value: 0.5
    estimate: 'passing through cut or partly cut wire means finding gaps and picking a way through: about half speed'
    description: Walking-speed multiplier through uncut wire.
    calibrated: true
  uphillPenaltyPer10m:
    value: 0.02
    estimate: a loaded man climbing a slope loses about 2 per cent of his speed for every 10 m of height gained over a leg; the ridge's
      slopes rise some tens of metres
    description: Fraction of walking speed lost per 10 metres of climb.
    calibrated: true
  nightVisibilityM:
    value: 50
    estimate: on a moonless night a man is seen at a few tens of metres; flares light patches for a moment
    description: How far men can see on a moonless night, in metres.
    calibrated: true
  twilightMin:
    value: 35
    estimate: civil twilight (sun 0.8 to 6 degrees below the horizon) lasts about 34 minutes at 50.4 deg N in early April (spherical
      astronomy, declination about +7.6 deg)
    description: Minutes of twilight at dawn and dusk when visibility rises or falls.
  tankBogPerKm:
    value: 0.3
    estimate: the 1917 Mark II tanks were slow, unreliable and sank in shell craters and mud; about a third bog or break down for each
      kilometre of cratered ground. Order of magnitude, not fitted to Vimy, where the tanks' fate is a validation target
    description: Chance a tank bogs or breaks down per kilometre of cratered ground.
    calibrated: true
  horseLossPerGasRound:
    value: 0.01
    estimate: each gas shell bursting within gasHorseRadiusM of a battery's horse lines kills or disables about 1 per cent of them;
      100 shells take about 60 per cent. Gassed horses were what kept the German guns from moving at Vimy (boh-1917-1 p. 320)
    description: Fraction of horses within the gas radius lost per gas shell.
    calibrated: true
  barrageBandDepthM:
    value: 90
    estimate: 'about one lift: the Vimy barrage lifted 100 yards (91 m) at a time (nicholson-1962 p. 253), and the zone its shells fall
      in at any moment is about that deep'
    description: Depth in metres of the band a creeping barrage covers at any moment.
    calibrated: true
  mgBarrageDepthM:
    value: 400
    estimate: the plan's figure, from the machine-gun barrage that created "a bullet-swept zone 400 yards ahead" of the infantry (nicholson-1962
      p. 253); the source gives where the zone lay, not its depth, so the depth is an estimate
    description: Depth in metres of the zone an indirect machine-gun barrage covers.
    calibrated: true
  captureRadiusM:
    value: 50
    estimate: 'bomb and bayonet range: a Mills bomb is thrown some 30 m and a rush covers the rest; inside 50 m the fight for a trench
      is hand to hand'
    description: Distance in metres within which attackers can capture a trench segment.
    calibrated: true
  captureRatio:
    value: 3
    estimate: the rule of thumb of three attackers to one defender to take a defended position
    description: Attackers to defenders needed to capture a segment (3 means 3 to 1).
    calibrated: true
  sortieDelayMin:
    value: 30
    estimate: 'Germans left in dugouts the assault had passed came out once they judged it gone: at Vimy "some sharp combats were still
      taking place with parties of the enemy emerging from dug-outs which had been passed over" during the consolidation of the Black
      and Red Lines (boh-1917-1 p. 333), some tens of minutes after'
    description: Minutes before defenders sortie from their dugouts after attackers have passed.
    calibrated: true
  lineFeatureMatchM:
    value: 150
    estimate: 'a tolerance for matching a digitized trench to an objective line: the lines and trenches are digitized separately from
      different maps, a few tens of metres apart at worst, and parallel trenches of one system lie 100-200 m apart'
    description: Distance in metres within which a trench feature counts as belonging to a line.
  callForFireMin:
    value: 10
    estimate: 'a call for fire was answered with a short burst on the place named, not with a new programme: about 10 minutes of fire,
      as long as the standing barrage a stalled attack asks for (stallBarrageMin). The call''s journey to the guns is the channels''
      delay, not part of this'
    description: Minutes the guns that answer a call for fire keep firing on its target.
    calibrated: true
  stallBarrageMin:
    value: 10
    estimate: a stalled attack has lost its barrage (which moves 100 yards every 3 minutes, nicholson-1962 p. 253, so 300 m in 10 minutes);
      the fresh attack its headquarters sends in asks for that much standing barrage on the stalled line's trench to cover it
    description: Minutes of standing barrage a headquarters calls for on each enemy-held trench of a stalled line when it commits its
      reserve to it.
    calibrated: true
  gunCaptureRadiusM:
    value: 300
    estimate: a battery and its crews occupy about 100 m; attackers within effective rifle and Lewis range (300 m) make it untenable
      and the guns are taken or abandoned
    description: Distance in metres within which attackers capture a battery.
    calibrated: true
  tankSuppressRadiusM:
    value: 100
    estimate: a tank draws and returns fire within a hundred metres; machine-gun posts that see it close up go quiet
    description: Distance in metres within which a tank suppresses machine guns and infantry.
    calibrated: true
  tankBogMudFactor:
    value: 3
    estimate: 'rain-soaked ground made the cratered field far worse for tanks: at Vimy the eight tanks "had been unable to negotiate
      the gripless mud and the deep shell craters" (nicholson-1962 p. 254), and a tank''s 3.7 miles an hour fell to half a mile an
      hour "in heavily shelled ground" (p. 168). A day of rain is taken to treble the chance of bogging; order of magnitude'
    description: Multiplier on a tank's chance of bogging after a whole day of rain (it applies as the factor to the power of the
      share of the past 24 hours it rained).
    calibrated: true
  tankMachineGuns:
    value: 5
    estimate: 'a "male" tank carried two 6-pounders and four machine guns, a "female" six machine guns (nicholson-1962 p. 168, of the
      Mark I); which marks and how many of each served at Vimy is not in the sources read, so an even mix: 5'
    description: Machine guns a moving tank fires at the enemy near it, which suppress and (in this model) hit no one.
  gasHorseRadiusM:
    value: 200
    estimate: a gas shell's cloud spreads and drifts a couple of hundred metres before it thins; the plan's 1 km would gas whole valleys
      from one shell, so 200 m
    description: Distance in metres from the point of impact within which gas reaches horses.
    calibrated: true
  gapMultiplier:
    value: 2
    estimate: 'an explanation threshold, not behaviour: a company more than twice its follow distance behind the barrage is said to
      have lost it (cause barrage-moved-on)'
    description: How many times the doctrine's follow distance a company must lag behind the barrage before its losses are put down
      to the barrage having moved on.
  maxTargetsPerFirer:
    value: 2
    estimate: a company engages the nearest enemies; splitting its fire between more than two groups is unrealistic for one company
      commander's control
    description: Most targets a single firer can engage at once.
    calibrated: true
  crewPerLewis:
    value: 2
    source: ss143-1917
    page: '9'
    note: 'the Lewis gun section is "1 N. C. O. and 8 O. R. (includes Nos. 1 and 2)": the Nos. 1 and 2 serve the gun and alone carry
      no rifle in the assault (p. 9); the rest carry drums and fight as riflemen'
    description: Men who serve one Lewis gun (they fire no rifle).
  crewPerMg:
    value: 4
    estimate: 'the men at the gun in action: the firer, the loader and two ammunition carriers. The German machine-gun company had 48
      gunners for 6 guns, 8 a gun (german-handbook-1917 p. 50), the others reliefs and carriers'
    description: Men who serve one machine gun (they fire no rifle).
  trenchProximityM:
    value: 15
    estimate: a trench, its parapet and the shell holes along it lie within a few metres of the digitized line, which is itself a few
      metres off
    description: Distance in metres within which a company counts as being in a trench.
  churnAreaPerShellM2:
    value: 30
    estimate: a field-gun or howitzer shell leaves a crater a few metres across (about 3 to 8 m) and throws up a lip around it; about 30 square
      metres of ground disturbed a round is the middle of that range. Order of magnitude, not fitted to Vimy
    description: Square metres of ground one shell churns up.
    calibrated: true
  crateredShare:
    value: 0.5
    estimate: once shell holes and their lips cover about half of a 50 m cell, no line across it is unbroken and men move and shelter as on
      cratered ground. A threshold of judgement, not fitted to Vimy
    description: Share of a 50 m square covered by shell holes at which its ground counts as cratered.
    calibrated: true
  wireUncutBelow:
    value: 0.5
    estimate: an explanation threshold, not a rate. With half a belt still standing the gaps are lanes the enemy's machine guns cover,
      and the attackers must look for them or cut a way through; below that share cut, the wire is said to be uncut. A judgement, not
      fitted to Vimy
    description: Share of a trench segment's wire cut below which the bombardment's result gives the cause wire-uncut.
  strongpointRadiusM:
    value: 100
    estimate: "a strong point held by a company or more is taken to hold about one company's frontage of trench: the scenario's 41
      first-position garrison companies hold some 8 km of it between them, about 200 m each (oob-german.yaml, geo/features.geojson),
      so a diameter of 200 m. Geometry by judgement, not fitted to Vimy"
    description: Radius in metres of a strong point mapped as a point with no radius of its own; its diameter is the frontage
      the bombardment allots rounds by.
    calibrated: true
  villageRadiusM:
    value: 50
    estimate: the radius the map has drawn a village with when it gives none (packages/app/src/map/style.ts DEFAULT_RADIUS_M), a hamlet's
      few houses; every Vimy village is mapped with its own radius
    description: Radius in metres of a village mapped as a point with no radius of its own.
  woodRadiusM:
    value: 60
    estimate: the radius the map has drawn a wood with when it gives none (packages/app/src/map/style.ts DEFAULT_RADIUS_M), a copse; the
      Vimy woods are mapped as polygons
    description: Radius in metres of a wood mapped as a point with no radius of its own.
  craterRadiusM:
    value: 10
    estimate: the radius the map has drawn a crater with when it gives none (packages/app/src/map/style.ts DEFAULT_RADIUS_M); a mine
      crater of 1916-17 was some tens of metres across, a shell crater a few metres
    description: Radius in metres of a crater mapped as a point with no radius of its own.
  unobservedFireFactor:
    value: 0.3
    estimate: a battery that should be corrected by an observer but whose fall of shot nobody sees fires by the map at a target it has not
      registered, and most of its rounds land off it; about a third as effective as observed fire. Order of magnitude, not fitted to Vimy
    description: How effective the fire of a battery observed by forward observers or aircraft is when nobody can see where it falls, as
      a share of observed fire (fire by the map on positions plotted in advance is not reduced).
    calibrated: true
  observerRangeM:
    value: 1500
    estimate: a forward observer in an observation post, or an aircraft observer over the lines, watches shells fall on targets one to two
      kilometres off; 1,500 m is the middle. When men can see less far than that (night, mist, snow) observation falls in proportion.
      Order of magnitude, not fitted to Vimy
    description: Distance in metres an artillery observer must be able to see to watch the fall of shot; observed fire loses effect in
      proportion when visibility is shorter.
    calibrated: true
  batteriesRecoveredFrac:
    value: 0.5
    estimate: an explanation threshold, not behaviour. Once half of a side's guns are back in action after the counter-battery fire at Zero,
      its defensive fire is said to have recovered (cause batteries-recovered)
    description: Share of a side's guns in action at which the event batteries-recovered is emitted, and its defensive fire carries that
      cause.
  blockedExitFactor:
    value: 1
    estimate: shelling that wrecks a trench also buries and blocks dug-out stairways, and the garrison must dig or climb out through the
      wreckage; a wholly wrecked trench is taken to double the time to come up. Order of magnitude, not fitted to Vimy
    description: How much a wrecked trench slows its garrison coming up out of its dug-outs; the time to emerge is emergeMin x (1 +
      blockedExitFactor x trenchDamage).
    calibrated: true
  isolationRadiusM:
    value: 300
    estimate: "a company with no other company of its side near it while the enemy is near is cut off: it cannot see its neighbours or
      be supported by them. A company holds about 200 m of front (strongpointRadiusM), so 300 m reaches past the middle of the next
      company's frontage on either side. A judgement, not fitted to Vimy"
    description: Distance in metres within which a company needs another company of its side, when an enemy is that close, not to count
      as isolated (doctrine isolationDrain then lowers its morale).
    calibrated: true
  mgUnobservedBelow:
    value: 0.2
    estimate: an explanation threshold, not a rate. A segment whose trench the bombardment wrecked less than a fifth of, or that was
      spared on purpose, kept its machine-gun posts and their fields of fire, so the guns' first fire is said to come from posts the
      bombardment did not find (cause mg-unobserved). A judgement, not fitted to Vimy
    description: Trench damage below which a garrison's machine guns opening fire are said to come from a segment the bombardment did
      not deal with (cause mg-unobserved).
  fireRefsMin:
    value: 10
    estimate: an explanation window, not behaviour. A company pinned, falling back, surrendering or destroyed is said to have been brought
      to it by the fire of the last 10 minutes, about three barrage lifts; earlier fire is reached through the refs of that fire
    description: Minutes of earlier fire on a company that its morale events refer to (refs) and take their fire causes from.
  suppressionSpeedLoss:
    value: 0.5
    estimate: "the plan's starting value: men under fire move from cover to cover in short rushes and stop to return fire, so a company
      fully suppressed but not pinned keeps about half its pace. A judgement, not fitted to Vimy"
    description: Share of its walking speed a fully suppressed company loses; its speed is multiplied by 1 - suppressionSpeedLoss x
      suppression.
    calibrated: true
  fatiguePerHourUnderFire:
    value: 0.1
    estimate: "time under fire tires men as marching does: crouching, digging in and the strain of shelling. An hour of it is taken to
      tire like 5 km of advance with a full load (doctrine fatiguePerKm 0.02 a km), so 0.1 an hour. A judgement, not fitted to Vimy"
    description: Fatigue a company gains for each hour that fire comes in on it (on the doctrine's 0 to 1 scale, beside fatiguePerKm).
    calibrated: true
  bombsPerManCleared:
    value: 0.5
    estimate: "moppers-up bomb a dugout's entrances and call on the men below to come up (ss143-1917 p. 16: they 'guard the entrances
      to dugouts'); a party of 20 to 40 men is taken to come up after some 10 to 20 bombs down its stairways, about one bomb for every
      two men. A judgement, not fitted to Vimy"
    description: Bombs (grenades) a mopping-up company uses for each man it clears out of the dugouts.
    calibrated: true
  runnerMinPerKm:
    value: 15
    estimate: "a man on foot through trenches, shell holes and mud covers about 4 km an hour, so some 15 minutes a kilometre. The
      owner's research compendium has runners' times growing with the distance they go (a design estimate there too). A judgement,
      not fitted to Vimy"
    description: Minutes a runner needs for each kilometre between the sender and the receiver beyond the runnerDelayCoversKm that
      the runner channel's delayMin already allows for; nothing is added for a shorter way.
    calibrated: true
  runnerDelayCoversKm:
    value: 1.5
    estimate: "the runner channel's delayMin (30 minutes) was reasoned as a runner covering 1-2 km between headquarters in 20-40 minutes,
      so it already allows for about 1.5 km; only the way beyond that adds runnerMinPerKm"
    description: Kilometres of a runner's way that the runner channel's delayMin already allows for; runnerMinPerKm applies only to
      the distance beyond it.
    calibrated: true
  callForFireGuns:
    value: 6
    estimate: "a call for fire is taken to be answered by one battery, taken as six guns for both sides (the British field battery as
      commonly given, not checked against a source read for this project). A judgement, not fitted to Vimy"
    description: Guns that answer a call for fire, taken from the nearest batteries of the caller's side that are in action.
    calibrated: true
  hqRearOffsetBattalionM:
    value: 600
    estimate: "a battalion headquarters stood in its support or reserve trench, a dugout or a tunnel exit, some hundreds of metres behind
      its companies at Zero. A judgement, not fitted to Vimy"
    description: Metres behind the middle of its companies' places at Zero (away from the enemy) at which a battalion headquarters
      stands when the scenario gives no hqPosition.
    calibrated: true
  hqRearOffsetBrigadeM:
    value: 2000
    estimate: "a brigade (or German regiment) headquarters stood a kilometre or two behind the front line, beyond field-gun reach of most
      trench fire. A judgement, not fitted to Vimy"
    description: Metres behind the middle of its companies' places at Zero (away from the enemy) at which a brigade or regiment
      headquarters stands when the scenario gives no hqPosition.
    calibrated: true
  hqRearOffsetDivisionM:
    value: 6000
    estimate: "a division headquarters stood some kilometres back, in a village or chateau beyond most of the enemy's field artillery.
      A judgement, not fitted to Vimy"
    description: Metres behind the middle of its companies' places at Zero (away from the enemy) at which a division headquarters
      stands when the scenario gives no hqPosition.
    calibrated: true
  hqRearOffsetCorpsM:
    value: 12000
    estimate: "a corps (or German Gruppe) headquarters stood about ten kilometres or more behind the front, beyond the reach of all but
      the heaviest guns. A judgement, not fitted to Vimy"
    description: Metres behind the middle of its companies' places at Zero (away from the enemy) at which a corps or group
      headquarters stands when the scenario gives no hqPosition.
    calibrated: true
  hqRearOffsetArmyM:
    value: 25000
    estimate: "an army headquarters stood a day's march or more behind the front. A judgement, not fitted to Vimy"
    description: Metres behind the middle of its companies' places at Zero (away from the enemy) at which an army headquarters stands
      when the scenario gives no hqPosition.
    calibrated: true
  counterAttackConsolidateMin:
    value: 60
    estimate: "German doctrine wanted the immediate counter-attack in before the enemy could \"rest or install himself\" (survey-german-tactics-1918
      p. 35, as quoted in doctrine/de-1917.yaml); taking a captured trench in hand (fire steps turned, Lewis guns and bombing blocks posted,
      wire put out) is taken to need about an hour. A judgement, not fitted to Vimy"
    description: Minutes after a trench changes hands by which its new holders count as consolidated, when a counter-attack on it would go in.
    calibrated: true
  counterAttackConsolidatedFactor:
    value: 2
    estimate: "a counter-attack that comes before the attackers have consolidated meets tired, disorganised men; once they hold the trench
      as a position it is an attack on a defended trench like any other. Twice the men is the builder's figure for that difference, for
      Plan 4 to calibrate"
    description: How many times counterAttackMinRatio a counter-attack needs once the attackers have consolidated the trench.
    calibrated: true
