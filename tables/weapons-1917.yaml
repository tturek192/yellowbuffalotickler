      estimate: '2 x maxRangeM: an observed or registered gun keeps most of its accuracy across its range, losing about 40 per cent
        at its longest range (exp(-0.5)); order of magnitude only (tables.md, Coefficients)'
      description: Distance in metres over which the weapon's effect falls by a factor of e (about 2.7), for the spread of its fire
        with range.
      calibrated: true
    lethality:
      value: 0.37
