        lethal area grows more slowly than its weight; order of magnitude only, for Plan 4 to calibrate (tables.md, Coefficients)'
      description: Men hit per round, on average, when the weapon fires on a target group of full density standing in the open at close
        range; cover, range, sight and suppression reduce it.
