# Weapons in use on the Western Front in April 1917, for the combat model. Every number is a Param (tables/README.md).
# Facts (rates of fire, ranges, shell weights) cite a source in tables/sources.yaml or say why they are estimates; the
# coefficients (lethality, rangeScaleM, suppressPerRound) are calibrated estimates, for Plan 4 to calibrate.
# Research notes: docs/research/model/tables.md. The coefficients follow the rules written in their estimates.
weapons:
  rifle:
    kind: small-arms
    rpm:
      value: 5
      estimate: 'aimed fire kept up in action; the rapid rates are for a minute or so: 20-30 aimed shots a minute for the SMLE (wiki-lee-enfield)
        and 15 for the Gewehr 98 (wiki-gewehr-98), whose "maximum rate of fire obtainable" is 35 to 40 (german-handbook-1917, the rifle
        section). Men moving, loading under fire or looking for a target fire far less; a third of the slower rapid rate, 5'
      description: Rounds one weapon fires per minute over a sustained engagement (a barrage, a bombardment or a firefight of some minutes),
        not its burst rate.
    maxRangeM:
      value: 2743
      source: wiki-lee-enfield
      note: 3,000 yards, the SMLE's maximum range; the Gewehr 98's is 3,735 m (wiki-gewehr-98). One id for both sides' rifles
      description: Longest range in metres at which the weapon fires at all; beyond it the model gives it no effect.
    rangeScaleM:
      value: 400
      estimate: 'aimed rifle fire is effective to about 500 m (the SMLE''s 550-yard effective range, wiki-lee-enfield; the Gewehr 98''s
        500 m with iron sights, wiki-gewehr-98): 400 m leaves a quarter of the point-blank effect at 550 m and almost none at 2 km'
      description: Distance in metres over which the weapon's effect falls by a factor of e (about 2.7), for the spread of its fire
        with range.
      calibrated: true
    lethality:
      value: 0.03
      estimate: one hit in about 30 aimed rounds at a dense group in the open at close range; with rangeScaleM a rifleman then hits
        0.07 men a minute at 300 m, so a machine gun (3.6 a minute at 300 m) is worth about 50 rifles, the builder's order of magnitude,
        not a figure from a source read (tables.md, Coefficients)
      description: Men hit per round, on average, when the weapon fires on a target group of full density standing in the open at close
        range; cover, range, sight and suppression reduce it.
      calibrated: true
    suppressPerRound:
      value: 0.05
      estimate: 'half a machine-gun bullet''s: aimed rounds come singly; a 100-rifle company firing 5 rounds a minute each adds 0.25
        a minute to a 100-man target'
      description: 'Suppression one round adds to its target, before dividing by the target''s men: 100 rounds at 0.1 on a 100-man company
        add 0.1 (1 is fully suppressed).'
      calibrated: true
  lewis:
    kind: lewis
    rpm:
      value: 250
      source: lewis-1917
      page: 81 (Methods of fire)
      note: 'in traversing fire, bursts of five to ten rounds: "250 rounds per minute is all that is required at most"; the cyclic rate
        is 500-600 (wiki-lewis-gun) and a 47-round magazine empties in seconds'
      description: Rounds one weapon fires per minute over a sustained engagement (a barrage, a bombardment or a firefight of some minutes),
        not its burst rate.
    maxRangeM:
      value: 3200
      source: wiki-lewis-gun
      note: 3,500 yards maximum; effective range 880 yards
      description: Longest range in metres at which the weapon fires at all; beyond it the model gives it no effect.
    rangeScaleM:
      value: 500
      estimate: 'a bipod gun, lighter and less steady than a tripod machine gun: its effective range is 880 yards (805 m, wiki-lewis-gun),
        where 500 m leaves a fifth of the point-blank effect'
      description: Distance in metres over which the weapon's effect falls by a factor of e (about 2.7), for the spread of its fire
        with range.
      calibrated: true
    lethality:
      value: 0.01
      estimate: 'bursts spread more than aimed rifle rounds: one hit in 100 rounds at a dense group close by; at 300 m and 250 rounds
        a minute that is 1.4 men a minute, a little under half a tripod machine gun'
      description: Men hit per round, on average, when the weapon fires on a target group of full density standing in the open at close
        range; cover, range, sight and suppression reduce it.
      calibrated: true
    suppressPerRound:
      value: 0.08
      estimate: automatic fire suppresses more per round than aimed rifle fire, less than a tripod gun's beaten zone; between the rifle's
        0.05 and the machine gun's 0.1
      description: 'Suppression one round adds to its target, before dividing by the target''s men: 100 rounds at 0.1 on a 100-man company
        add 0.1 (1 is fully suppressed).'
      calibrated: true
  vickers:
    kind: mg
    rpm:
      value: 450
      source: wiki-vickers
      note: 450-500 rounds a minute; the lower end, for belt changes and relaying
      description: Rounds one weapon fires per minute over a sustained engagement (a barrage, a bombardment or a firefight of some minutes),
        not its burst rate.
    maxRangeM:
      value: 4115
      source: wiki-vickers
      note: 4,500 yards in indirect fire, the range the barrage guns used
      description: Longest range in metres at which the weapon fires at all; beyond it the model gives it no effect.
    rangeScaleM: &id001
      value: 1000
      estimate: 'a tripod machine gun''s fire stays dense far out (the MG 08 is sighted to 2,200 yards, german-handbook-1917 p. 51):
        1,000 m leaves three-quarters of the point-blank effect at 300 m and a tenth at 2,300 m, where indirect barrage fire works'
      description: Distance in metres over which the weapon's effect falls by a factor of e (about 2.7), for the spread of its fire
        with range.
      calibrated: true
    lethality: &id002
      value: 0.012
      estimate: 'the plan''s check: a gun firing about 400 rounds a minute at an exposed company moving in the open at 300 m should
        cause casualties in single figures a minute; 400 x 0.012 x exp(-300/1000) = 3.6 a minute'
      description: Men hit per round, on average, when the weapon fires on a target group of full density standing in the open at close
        range; cover, range, sight and suppression reduce it.
      calibrated: true
    suppressPerRound: &id003
      value: 0.1
      estimate: a gun's 400 rounds a minute on a 100-man company add 0.4 a minute, so sustained fire pins it (0.7) inside two minutes,
        less the decay (suppressionHalfLifeMin)
      description: 'Suppression one round adds to its target, before dividing by the target''s men: 100 rounds at 0.1 on a 100-man company
        add 0.1 (1 is fully suppressed).'
      calibrated: true
  mg08:
    kind: mg
    rpm:
      value: 400
      source: german-handbook-1917
      page: '51'
      note: '"400-500 rounds per minute"; the lower end, for belt changes (200-round belts, p. 51); machine gunners trained at "Sustained
        fire at the rate of 500 rounds per minute" (p. 52)'
      description: Rounds one weapon fires per minute over a sustained engagement (a barrage, a bombardment or a firefight of some minutes),
        not its burst rate.
    maxRangeM:
      value: 4023
      source: german-handbook-1917
      page: '51'
      note: '"Extreme range (at 32 deg elevation) 4,400 yards"; limit of sighting 2,200 yards'
      description: Longest range in metres at which the weapon fires at all; beyond it the model gives it no effect.
    rangeScaleM: *id001
    lethality: *id002
    suppressPerRound: *id003
  mg08-15:
    kind: lewis
    rpm:
      value: 250
      estimate: 'no rate for the 08/15 was found in the sources read. It is the MG 08 made light, fed from belts of "either 100 or 250
        rounds" (german-handbook-1918 p. 61), fired from a bipod by one gunner; in action, bursts and target changes. Taken as the practical
        rate of the British light gun, the Lewis (250 in traversing fire, lewis-1917 p. 81), the same class of weapon: 250'
      description: Rounds one weapon fires per minute over a sustained engagement (a barrage, a bombardment or a firefight of some minutes),
        not its burst rate.
    maxRangeM:
      value: 4023
      source: german-handbook-1918
      page: '61'
      note: '"The ballistics are similar to those of the ''08 pattern machine gun, but the light machine gun is not so accurate"; the
        MG 08''s extreme range is 4,400 yards (german-handbook-1917 p. 51)'
      description: Longest range in metres at which the weapon fires at all; beyond it the model gives it no effect.
    rangeScaleM:
      value: 600
      estimate: 'the MG 08''s ballistics (german-handbook-1918 p. 61) from a bipod, "not so accurate": between the Lewis gun''s 500
        m and the tripod MG 08''s 1,000 m'
      description: Distance in metres over which the weapon's effect falls by a factor of e (about 2.7), for the spread of its fire
        with range.
      calibrated: true
    lethality:
      value: 0.01
      estimate: '"not so accurate" as the MG 08 (german-handbook-1918 p. 61): a little under its 0.012, as the Lewis gun''s 0.01; at
        300 m and 250 rounds a minute, 250 x 0.01 x exp(-300/600) = 1.5 men a minute'
      description: Men hit per round, on average, when the weapon fires on a target group of full density standing in the open at close
        range; cover, range, sight and suppression reduce it.
      calibrated: true
    suppressPerRound:
      value: 0.08
      estimate: 'automatic fire from a light gun, as the Lewis gun: between the rifle''s 0.05 and the machine gun''s 0.1'
      description: 'Suppression one round adds to its target, before dividing by the target''s men: 100 rounds at 0.1 on a 100-man company
        add 0.1 (1 is fully suppressed).'
      calibrated: true
  18pdr:
    kind: field-gun
    rpm:
      value: 2
      source: nicholson-1962
      page: '253'
      note: 'the creeping barrage at Vimy: "three rounds a minute" on the front trench for three minutes, then "slowing their rate of
        fire to two rounds per minute"; the gun was limited to 4 a minute from January 1917 (wiki-qf-18pdr)'
      description: Rounds one weapon fires per minute over a sustained engagement (a barrage, a bombardment or a firefight of some minutes),
        not its burst rate.
    maxRangeM:
      value: 5966
      source: wiki-qf-18pdr
      note: 6,525 yards for the Mk I and II; 7,800 with the trail dug in, as it was for barrages
      description: Longest range in metres at which the weapon fires at all; beyond it the model gives it no effect.
    rangeScaleM:
      value: 11900
      estimate: '2 x maxRangeM: an observed or registered gun keeps most of its accuracy across its range, losing about 40 per cent
        at its longest range (exp(-0.5)); order of magnitude only (tables.md, Coefficients)'
      description: Distance in metres over which the weapon's effect falls by a factor of e (about 2.7), for the spread of its fire
        with range.
      calibrated: true
    lethality:
      value: 0.5
      estimate: '0.5 x sqrt(shellKg / 8.4): the 18-pdr''s 0.5 men hit per round on a dense group in the open (one shrapnel or HE burst
        among a platoon in the open hitting about one man in two rounds), scaled by the square root of shell weight because a burst''s
        lethal area grows more slowly than its weight; order of magnitude only, for Plan 4 to calibrate (tables.md, Coefficients)'
      description: Men hit per round, on average, when the weapon fires on a target group of full density standing in the open at close
        range; cover, range, sight and suppression reduce it.
      calibrated: true
    suppressPerRound:
      value: 3.0
      estimate: '6 x lethality: one burst near a 100-man company adds about 0.03 suppression for the 18-pdr, so its 9 rounds a minute
        on 100 m of front pin a company inside two or three minutes; the same ratio for every shell (tables.md, Coefficients)'
      description: 'Suppression one round adds to its target, before dividing by the target''s men: 100 rounds at 0.1 on a 100-man company
        add 0.1 (1 is fully suppressed).'
      calibrated: true
    shellKg:
      value: 8.4
      source: wiki-qf-18pdr
      note: 18.5 lb
      description: Weight of one shell or bomb in kilograms, as fired.
