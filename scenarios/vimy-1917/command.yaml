# The command model's data for Vimy: who could talk to whom and how, the written plan's contingent operations, the
# off-map forces on the flanks, air control and the end conditions (Plan 3 Task 4). Research notes, each entry's basis,
# the conflicts, the open questions and the targets the engine is checked against (report delays, the improvised
# attacks of 9 and 10 April): docs/research/vimy/command.md.
#
# Conventions (command.md):
# - A link names the sender's level (from) and the receiver's (to): reports go up, orders come down. Some channels run
#   one way only: pigeons, power buzzers and contact aeroplanes carry reports back, never orders forward. The links
#   that skip a level (battalion to division or corps) are the contact aeroplanes and pigeons, whose messages were
#   dropped or telephoned at divisional and corps headquarters. Channel delays and failure rates are the model
#   tables' (tables/channels.yaml), not repeated here.
# - Operations hold only what the written plan held in advance. Improvised attacks (the 85th's and 46th's on the
#   evening of 9 April, the 10th Brigade's on Hill 145 on 10 April, the German counter-attacks ordered on 9 April) are
#   not here: the engine decides those, and their times are targets (historical.yaml; command.md, Targets).
# - Off-map forces are the flank formations outside the simulated force (spec 13.9), on a fixed schedule.
communications:
  links:
    # Canadian Corps, with the British 13th Brigade under the 2nd Canadian Division and the 5th Division as a group.
    # Battalion to brigade: no buried cable (the corps' buried pairs ran brigades to divisions, App. 12 p. 39); cable
    # run forward along captured trenches (BOH p. 310), runners, lamps and flags (BOH p. 310), and one power buzzer a
    # brigade frontage working back to an amplifier at brigade (App. 12 pp. 39-40; BOH p. 310 n.2).
    - { side: allied, from: battalion, to: brigade, channels: [surface-line, runner, visual, power-buzzer] }
    - { side: allied, from: brigade, to: battalion, channels: [surface-line, runner, visual] }
    # Pigeons homed to the divisional lofts, their messages wired on to the divisional report centre (App. 12 p. 40;
    # App. 25 p. 89); contact aeroplanes dropped messages at advanced divisional headquarters, with a landing place for
    # advanced corps headquarters (App. 12 p. 36; war-in-the-air-3 p. 344).
    - { side: allied, from: battalion, to: division, channels: [pigeon, contact-patrol] }
    - { side: allied, from: battalion, to: corps, channels: [contact-patrol] }
    # Brigade to division: the buried cable's pairs, a wireless trench set at each brigade in the line, despatch riders
    # (App. 12 p. 39; App. 25 p. 89).
    - { side: allied, from: brigade, to: division, channels: [buried-cable, wireless, runner] }
    - { side: allied, from: division, to: brigade, channels: [buried-cable, wireless, runner] }
    # Division to corps: the buried system along the corps front and the wireless control station in touch with the
    # Corps Signals Exchange (App. 12 p. 39; BOH p. 310).
    - { side: allied, from: division, to: corps, channels: [buried-cable, wireless] }
    - { side: allied, from: corps, to: division, channels: [buried-cable, wireless] }
    # The British 5th Division's 15th and 95th Brigades, in corps reserve in bivouacs behind the front: telephone and
    # despatch riders (an estimate; no source read describes their links).
    - { side: allied, from: brigade, to: group, channels: [surface-line, runner] }
    - { side: allied, from: group, to: brigade, channels: [surface-line, runner] }
    - { side: allied, from: group, to: corps, channels: [surface-line, runner] }
    - { side: allied, from: corps, to: group, channels: [surface-line, runner] }
    # German side. Forward: telephone lines mostly cut by the bombardment, so runners, and rocket signals to the
    # batteries (Nicholson p. 252; BOH pp. 318 n.2, 320, 333 n.2). Rear: telephone (an estimate; no source read
    # describes the German rear links).
    - { side: central, from: battalion, to: regiment, channels: [surface-line, runner, visual] }
    - { side: central, from: regiment, to: battalion, channels: [surface-line, runner] }
    - { side: central, from: regiment, to: division, channels: [surface-line, runner] }
    - { side: central, from: division, to: regiment, channels: [surface-line, runner] }
    - { side: central, from: division, to: group, channels: [surface-line] }
    - { side: central, from: group, to: division, channels: [surface-line] }
    - { side: central, from: group, to: army, channels: [surface-line] }
    - { side: central, from: army, to: group, channels: [surface-line] }
    - { side: central, from: division, to: army, channels: [surface-line] }
    - { side: central, from: army, to: division, channels: [surface-line] }
  # Artillery liaison: the First Army artillery plan put a heavy artillery group commander beside each attacking
  # division's commander. No source read gives field artillery liaison officers at Canadian brigades or battalions
  # (command.md, Open questions); the machine-gun group commanders at brigade battle headquarters are machine-gun, not
  # artillery, liaison and are not entered.
  liaison:
    - side: allied
      formationId: 1cdn
      note: &heavyLiaison
        value: "a heavy artillery group commander lives beside the divisional commander, responsible for the heavy artillery's liaison with the infantry"
        source: boh-1917-appendices
        page: "App. 15, para. 6 (p. 52)"
        note: "'He should live in the closest touch with the Divisional Commander on whose front he is working'; BOH p. 312: 'a liaison much closer than usual between the heavy artillery headquarters and the infantry divisions'"
    - { side: allied, formationId: 2cdn, note: *heavyLiaison }
    - { side: allied, formationId: 3cdn, note: *heavyLiaison }
    - { side: allied, formationId: 4cdn, note: *heavyLiaison }

# The written plan's contingent phases. The engine decides whether and when each goes in: after its prerequisite line is
# known taken at its formation's headquarters, not before notBefore, and only at an acceptable force ratio.
operations:
  # The Northern Attack. First Army Order No. 103 (5 April): "On the assumption that the attack on the Vimy Ridge
  # reaches its objective on Z day", the Canadian Corps to take the Pimple "on the night of Z/Z + 1 days", the hour left
  # to the corps; whether it goes in to be decided on Z day. The 10th Brigade was "originally destined to capture Hill
  # 120" (BOH p. 343). Fought on 12 April, after the 10th Brigade had been used on Hill 145 (a target, not an input).
  - id: 10bde-pimple
    side: allied
    formationId: 10bde
    kind: attack
    target: { featureId: the-pimple }
    # The 4th Division's final objective, Hill 145's eastern slope: the Order's "reaches its objective on Z day".
    prerequisite: { lineId: red-4cdn, sectorId: barrage-4cdn }
    # "The night of Z/Z + 1": civil dusk at the frame origin on 9 April is 20:07 on the scenario's clock (command.md).
    notBefore: 1917-04-09T20:00
    plan:
      value: "the 10th Brigade attacks the Pimple (Hill 120) on the night after Z day, if the attack on the ridge has reached its objective"
      source: boh-1917-appendices
      page: "App. 42 (p. 136), paras. 1, 4"
      note: "First Army Order No. 103, 5 April: 'the attack to be carried out on the night of Z/Z + 1 days'; BOH p. 343: 'to have followed within 24 hours of the Southern'; Nicholson p. 262: 'provided the general situation on the afternoon of 9 April had not required its employment elsewhere'"
  # First Army's considerations of action after the attack (28 March): the Canadian Corps "to attack the Pimple and
  # occupy Vimy and Willerval", the 5th Division "to be first employed in the advance east". An appreciation, not an
  # order, and the corps scheme left out any exploitation (Nicholson p. 258; BOH p. 333): command.md, Conflicts.
  - id: 5bdiv-willerval
    side: allied
    formationId: 5bdiv
    kind: attack
    target: { featureId: willerval }
    prerequisite: { lineId: brown-1cdn, sectorId: barrage-1cdn }
    plan:
      value: "after the ridge is taken, the 5th Division leads the advance east and the corps occupies Willerval"
      source: boh-1917-appendices
      page: "App. 29 (pp. 96-98), paras. 4, 6"
      note: "First Army G.S. 529(a), 28 March: 'Canadian Corps — to attack the Pimple and occupy Vimy and Willerval'; '5th Division to be first employed in the advance east'"
  - id: 5bdiv-vimy
    side: allied
    formationId: 5bdiv
    kind: attack
    target: { featureId: vimy }
    prerequisite: { lineId: brown-2cdn, sectorId: barrage-2cdn }
    plan:
      value: "after the ridge is taken, the 5th Division leads the advance east and the corps occupies Vimy"
      source: boh-1917-appendices
      page: "App. 29 (pp. 96-98), paras. 4, 6"
      note: "First Army G.S. 529(a), 28 March: 'occupy Vimy and Willerval'; in a rapid German withdrawal the corps was 'to seize Vimy and form a defensive flank facing north' (para. 6)"

# The flanks, outside the simulated force (spec 13.9). The I Corps pieces that supported the Canadians (BOH pp. 306-307)
# are already in the artillery park (fireplan.yaml), so they are not repeated here (command.md, Conflicts).
offMap:
  fire:
    - id: xvii-corps-right-flank
      side: allied
      weapon: 60pdr
      guns:
        value: 23
        estimate: "no source read says how many XVII Corps guns fired on the Canadian flank. Its heavy artillery had ten 60-pdr and two 6-inch gun batteries (BOH p. 226); at the Canadian Corps' sizes (54 60-pdrs in nine batteries, BOH p. 306 n.1 and rca-ww1-history; 8 6-inch guns in two) that is 68 long guns, and one-third, the share of its left division of three, is 23 (command.md)"
      window: { from: 1917-04-09T05:30, to: 1917-04-09T13:18 }
      target: { featureId: farbus-wood }
      cite:
        value: "XVII Corps (Third Army) artillery on the German battery positions on the Canadian right, from Zero until the Canadians reach Farbus Wood"
        source: boh-1917-1
        page: "313"
        note: "'Close co-operation was maintained with the artillery of the XVII. Corps, Third Army, on the right ... for dealing with ... battery positions on the Canadian flanks'; the window ends at the plan's 1:18 p.m. on the Brown Line (Nicholson p. 248)"
  attacks:
    - id: 24div-bois-en-hache
      side: allied
      name: "British 24th Division (73rd Brigade): the Bois en Hache, across the Souchez from the Pimple"
      window: { from: 1917-04-12T05:00, to: 1917-04-12T08:00 }
      targetFeatureId: the-pimple
      suppressFrac:
        value: 0.25
        estimate: "no source measures it. The attack drew off fire that would have met the 10th Brigade: the Leinster 'were enfiladed by machine-gun fire from south of the Souchez stream' (BOH p. 348). A quarter of the Pimple garrison's fire is the builder's figure, for Plan 4 to calibrate (command.md)"
      cite:
        value: "the 73rd Brigade attacks the Bois en Hache simultaneously with the Canadian attack on the Pimple"
        source: boh-1917-1
        page: "343, 347-348"
        note: "'The assault, simultaneous with that against the Pimple and Bois de Givenchy spurs, was to be delivered by two battalions of the 73rd Brigade'; barrage at 5 a.m.; the window ends when the 46th 'could report the left flank secure', about 8 a.m. (Nicholson p. 263)"

# Air control (spec 13.10): a setting, not a simulated air war.
air:
  # "The Flying Corps was superior to the German air service along the active front numerically, but inferior
  # technically" (war-in-the-air-3 p. 332); Nicholson p. 251: the enemy, "although outnumbered", had the advantage in
  # speed and fire-power, yet the R.F.C. "continued its reconnaissance programme".
  superiority: contested
  observedFrac:
    value: 0.75
    range: [0.75, 0.86]
    sources:
      - { source: vimy-brief-2026, page: "as quoted in the design spec, s. 13.10", note: "'Air observers adjusted about 75% of counter-battery shoots'; the brief's own source is not named" }
      - { source: nicholson-1962, page: "251", note: "'Of an estimated 212 guns opposite the Canadian Corps, 83 per cent were located by various means, including aerial observation'" }
      - { source: boh-1917-1, page: "314", note: "'86 per cent. of the 212 active German battery positions on and behind the ridge had been correctly located'" }
    note: "the 0.75 share of counter-battery shoots adjusted from the air is the brief's and not found in the sources read; the official histories give the share of German batteries located by all means, aircraft among them (0.83, 0.86), and war-in-the-air-3 p. 345 has 'the greater part of the air work for the artillery' on 9 April spent locating active batteries. The range runs from the brief's figure to BOH's located share (command.md)"

# How a run ends and who wins (spec 12).
end:
  # Nicholson p. 245: "The crest of the Ridge was formed by two heights, Hill 135 ... and Hill 145"; spec 12: for Vimy
  # the key ground is "the ridge crest, Hill 145 and the Pimple". The crest is held through its two heights.
  keyGround:
    - { id: crest-hill-135, name: "The ridge crest: Hill 135, north of Thélus", featureId: hill-135 }
    - { id: crest-hill-145, name: "The ridge crest: Hill 145", featureId: hill-145 }
    - { id: the-pimple, name: "The Pimple (Hill 120)", featureId: the-pimple }
  lullMin:
    value: 2880
    estimate: "48 hours. The longest pause between attacks in the battle was from the 10th Brigade's attack on Hill 145 (3 p.m. on 10 April, BOH p. 342) to the Pimple (5 a.m. on 12 April, BOH p. 345), about 38 hours, the result of the Northern Attack's being 'postponed for 48 hours' (BOH p. 343). A shorter lull would end a run that follows the historical course before the Pimple; 48 hours is the postponement itself (command.md)"
