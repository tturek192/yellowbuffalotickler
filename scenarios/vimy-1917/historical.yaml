  prisonersTaken:
    - bySide: allied
      window: { from: 1917-04-09T05:30, to: 1917-04-09T23:59 }
      count:
        value: 3404
        range: [3400, 3404]
        sources:
          - { source: boh-1917-1, page: "341 n.1", note: "'counted up to midnight was 62 officers and 3,342 other ranks, but at that hour more were still coming in'" }
          - { source: nicholson-1962, page: "261", note: "'Up to midnight on 9-10 April, about 3400 German prisoners had been counted'" }
        note: "the same count, exact in BOH and rounded in Nicholson; both say more were still coming in"
    - bySide: allied
      window: { from: 1917-04-09T05:30, to: 1917-04-14T23:59 }
      count: { value: 4000, source: nicholson-1962, page: "265", note: "'capturing more than 4000 prisoners' in the six days; a lower bound" }

  gunsCaptured:
    window: { from: 1917-04-09T05:30, to: 1917-04-14T23:59 }
    field: { value: 54, source: nicholson-1962, page: "265", note: "'seized 54 guns, 104 trench mortars and 124 machine-guns' in six days, guns of all calibres; BOH p. 337 n.1: 31 pieces by the 1st and 2nd Divisions on 9 April, 21-cm howitzers to 77-mm guns" }
    trenchMortars: { value: 104, source: nicholson-1962, page: "265" }
    machineGuns: { value: 124, source: nicholson-1962, page: "265" }

  # When the German reserves reached the battlefield (formation ids from oob-german.yaml; times are British time).
  reserveArrivals:
    - formationId: rir262-iii
      at: { value: 1917-04-09T20:00, estimate: "BOH p. 355: 'It was snowing and already dark when the troops for the northern part of the operation reached La Chaudiere'; p. 354: 'after nightfall'; computed sunset on 9 April at Vimy is about 19:30 British Summer Time and civil dusk about 20:05, so dark about 20:00 (historical.md)" }
      where: "La Chaudière, to counter-attack Hill 135; held instead to fill gaps along the lower edge of the Bois de la Folie (BOH p. 355)"
    - formationId: ir118-i
      at: { value: 1917-04-09T20:00, estimate: "with the northern counter-attack force, which reached La Chaudière 'already dark' (BOH p. 355); as for rir262-iii" }
      where: "La Chaudière, from east of Lens (BOH pp. 354-355)"
    - formationId: rir34-iii
      at: { value: 1917-04-09T20:00, estimate: "with the northern counter-attack force, which reached La Chaudière 'already dark' (BOH p. 355); as for rir262-iii" }
      where: "La Chaudière, from east of Lens (BOH pp. 354-355)"
    - formationId: rir225-i
      at: { value: 1917-04-09T16:30, estimate: "BOH p. 338 n.1: 'newly arrived in Arleux' when ordered to 'recapture' Willerval after the Canadian Light Horse patrols, which set out at 4.20 p.m. (p. 338); 16:30 taken" }
      where: "Arleux, then towards Willerval and Farbus (BOH pp. 338-339)"
    - formationId: bir6-iii
      at: { value: 1917-04-09T20:00, estimate: "the southern counter-attack force 'likewise failed to materialize' after dark and only closed gaps (BOH p. 355); its arrival time is not given; taken with bir21-iii, 'after dusk' (p. 277)" }
      where: "behind the 1st Bavarian Reserve Division, closing gaps between Farbus Wood and the Bois de la Ville (BOH pp. 354-355)"
    - formationId: bir21-iii
      at: { value: 1917-04-09T20:00, estimate: "BOH p. 277: 'After dusk there appeared on its right flank III./21st Bavarian Regiment'; dark about 20:00, as for rir262-iii" }
      where: "on the right of the 1st Bavarian Reserve Regiment's remnant in the Point du Jour line, by the Bailleul-Thélus road (BOH p. 277)"
    - formationId: bir11-iii
      at: { value: 1917-04-09T17:00, estimate: "BOH p. 355: Group Souchez's resting battalions assembled between Liévin and Méricourt and 'were in position by late afternoon'; this one reinforced the southern end of Givenchy; 17:00 taken" }
      where: "the southern end of Givenchy (BOH p. 355)"
    - formationId: brir21-i
      at: { value: 1917-04-09T17:00, estimate: "BOH p. 355: halted 'behind the Bois de l'Hirondelle', in position 'by late afternoon'; 17:00 taken" }
      where: "behind the Bois de l'Hirondelle, two miles behind Givenchy (BOH p. 355)"
    - formationId: bir14-i
      at: { value: 1917-04-10T00:00, source: nicholson-1962, page: "260", note: "ordered at 6 p.m. to regain Hill 145's northern slope: 'It was midnight before the troops reached the Pimple'; BOH p. 355 agrees ('till midnight'); it had halted behind the Bois de l'Hirondelle by late afternoon" }
      where: "the Pimple, the start of its counter-attack on Hill 145's northern slope (Nicholson p. 260)"
    - formationId: 111id
      at: { value: 1917-04-10T06:00, estimate: "BOH p. 356: 'Early on the 10th the first regiments of the counter-attack divisions arrived in the battle zone', the 111th's 73rd and 164th entering the 79th Reserve Division's line; 06:00 taken for 'early'" }
      where: "the 79th Reserve Division's line, east of the ridge (BOH p. 356)"
    - formationId: 17id
      at: { value: 1917-04-10T06:00, estimate: "BOH p. 356: 'Early on the 10th', the 89th Grenadier and 75th Regiments entering the 1st Bavarian Reserve Division's line; BOH p. 277 has the 75th relieving on the night of the 10th (historical.md, Conflicts); 06:00 taken" }
      where: "the 1st Bavarian Reserve Division's line, before Bailleul and Farbus (BOH pp. 277, 356)"
    - formationId: 4gd
      at:
        value: 1917-04-10T18:00
        range: [1917-04-10T06:00, 1917-04-10T18:00]
        sources:
          - { source: boh-1917-1, page: "356", note: "'Early on the 10th ... The 5th Guard Grenadier Regiment (4th Guard Division) entered the line of the 16th Bavarian Division'" }
          - { source: boh-1917-1, page: "345 n.3", note: "'The 4th Guard Division began to arrive in the battle zone from Tournai ... on the evening of 10th April'" }
        note: "BOH gives both; the evening of the 10th is the division's arrival, early on the 10th its first regiment's; 06:00 and 18:00 taken for 'early' and 'evening'"
      where: "Givenchy and the Souchez valley, relieving the 16th Bavarian Division; the rest of the division east of Givenchy and between Avion and Méricourt (BOH p. 345 n.3)"

  endedAt:
    value: 1917-04-12T08:00
    range: [1917-04-12T08:00, 1917-04-14T18:00]
    sources:
      - { source: nicholson-1962, page: "263", note: "on 12 April, after the Pimple fell 'by six o'clock', 'in another two hours the 46th could report the left flank secure'; the ridge was then all in Canadian hands" }
      - { source: nicholson-1962, page: "265", note: "'With the completion of this limited exploitation the Battle of Vimy Ridge ended', on 14 April" }
      - { source: boh-1917-1, page: "351", note: "the advance of 14 April: 'By evening the nine-mile outpost line' ran from east of Bailleul to the Bois de l'Hirondelle" }
    note: "the scenario covers 9-12 April, so the working value is the capture of the Pimple and the whole ridge; the official battle runs to 14 April (historical.md). The range's 18:00 on 14 April is a chosen hour for BOH's 'By evening' (p. 351), which gives no time; 18:00 is also the hour taken for 'evening' in the 4th Guard Division's arrival"
