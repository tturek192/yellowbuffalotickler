# Historical targets the simulator is tested against. Research notes: docs/research/vimy/historical.md.
# Every value here cites only primary, official or scholarly sources, or is an estimate (the tier rule).
# Times are as the sources give them (British time); "earliest" and "latest" bracket when each line fell.
#
# The Pimple (Hill 120), 12 April, is a strongpoint feature (`the-pimple`), not an objective line, so it has no
# objectives entry: the 10th Brigade attacked at 5 a.m.; the 50th Battalion was on its objective about 5.45, the 44th
# on the Pimple by 6 a.m. (BOH p. 346; Nicholson p. 263: "by six o'clock"), and the 46th reported the left flank
# secure "in another two hours", about 8 a.m. (Nicholson p. 263). Its losses are under casualties (46bn), and its end
# is the lower bound of endedAt.
historical:
  objectives:
    - lineId: black-1cdn
      sectorId: barrage-1cdn
      earliest: { value: 1917-04-09T06:05, source: boh-1917-1, page: "322", note: "'by 6.5 a.m. ... the 1st Canadian Division was in possession of the Zwölfer-Graben, its first objective'" }
      latest: { value: 1917-04-09T06:15, source: nicholson-1962, page: "254", note: "'Both the 1st and 2nd Divisions were reported at the Black Line by 6:15'" }
    - lineId: black-2cdn
      sectorId: barrage-2cdn
      earliest: { value: 1917-04-09T06:05, source: boh-1917-1, page: "323", note: "'By 6.5 a.m. the four battalions ... had reached the line of the third trench, the division's first objective'" }
      latest: { value: 1917-04-09T06:15, source: nicholson-1962, page: "254", note: "reported at the Black Line by 6:15" }
    - lineId: black-3cdn
      sectorId: barrage-3cdn
      earliest: { value: 1917-04-09T06:05, source: boh-1917-1, page: "325", note: "the advance 'reached the third trench in the allotted time', 35 minutes after Zero (p. 304)" }
      latest: { value: 1917-04-09T06:25, source: nicholson-1962, page: "255", note: "'by 6:25 the capture of the Black Line by both brigades had been confirmed'" }
    - lineId: black-4cdn
      sectorId: barrage-4cdn
      earliest: { value: 1917-04-09T18:45, source: boh-1917-1, page: "341", note: "the 102nd Battalion held its half from the first rush, but the 87th's front fell to bombers at 1 p.m. and to two companies of the 85th, who 'started off across No Man's Land at 6.45 p.m.' (historical.md)" }
      latest: { value: 1917-04-10T04:15, source: boh-1917-1, page: "342", note: "'At 4.15 a.m. on the 10th patrols ... towards the German third trench beyond the summit ... found it empty'; it was occupied by the 85th and 75th, completing the first system (p. 304) on the Hill 145 front; the 12th Brigade's part of the line may have closed later (historical.md, Open questions)" }
    - lineId: red-1cdn
      sectorId: barrage-1cdn
      earliest: { value: 1917-04-09T07:05, source: boh-1917-1, page: "323", note: "'Shortly after 7 a.m. the division had taken its second objective ... with the exception of 500 yards on the right'; the 1st Battalion took that at 7.40 or after" }
      latest: { value: 1917-04-09T08:00, source: nicholson-1962, page: "255", note: "'By eight o'clock the 1st and 2nd Divisions were reported on the Red Line'" }
    - lineId: red-2cdn
      sectorId: barrage-2cdn
      earliest: { value: 1917-04-09T07:05, source: boh-1917-1, page: "324", note: "'Both brigades had reached their objectives up to time': Zero plus 95 minutes in the timetable (p. 304)" }
      latest: { value: 1917-04-09T08:00, source: nicholson-1962, page: "255", note: "'By eight o'clock the 1st and 2nd Divisions were reported on the Red Line'" }
    - lineId: red-3cdn
      sectorId: barrage-3cdn
      earliest: { value: 1917-04-09T07:05, estimate: "a lower bound from the timetable, not a reported capture time: BOH p. 304 has the barrage reach the 3rd and 4th Divisions' final objectives 'at Zero plus 95 minutes'; the line cannot have fallen before the barrage lifted onto it, and no earlier capture is recorded" }
      latest: { value: 1917-04-09T07:30, source: nicholson-1962, page: "255", note: "'the 3rd Division had reached the crest at 7:30 and occupied the western edge of the Bois de la Folie'; BOH p. 326: 'By 7.30 a.m.'" }
    - lineId: red-4cdn
      sectorId: barrage-4cdn
      earliest:
        value: 1917-04-10T15:00
        range: [1917-04-10T15:00, 1917-04-10T15:15]
        sources:
          - { source: boh-1917-1, page: "342", note: "the barrage 'opened at 3 p.m. on the Hangstellung', and the 44th and 50th entered it 'almost immediately after the barrage had lifted'" }
          - { source: nicholson-1962, page: "261", note: "'By 3:15 next afternoon' the two battalions 'were in position on Hill 145'; they charged as the barrage lifted" }
        note: "BOH's barrage opens at 3 p.m.; Nicholson has the battalions only in position by 3:15 (historical.md, Conflicts)"
      latest: { value: 1917-04-10T16:00, estimate: "BOH p. 343: 'Within thirty minutes' the Hangstellung was cleared (15:30, or 15:45 on Nicholson's 3:15); the 12th Brigade then moved its right forward and occupied its last objective 'at mid-afternoon' (Nicholson p. 261); 16:00 taken for the whole line" }
    - lineId: blue-1cdn
      sectorId: barrage-1cdn
      earliest: { value: 1917-04-09T10:50, estimate: "a lower bound from the timetable, not a reported capture time: BOH p. 304 has the third objective 'to be concluded at Zero plus 5 hours, 20 minutes'; no source gives an earlier capture" }
      latest: { value: 1917-04-09T11:15, source: boh-1917-1, page: "334", note: "'By 11.15 a.m. the brigade had reached the Roclincourt—Vimy track'; Nicholson p. 256: reported 'shortly after eleven o'clock'" }
    - lineId: blue-2cdn
      sectorId: barrage-2cdn
      earliest: { value: 1917-04-09T10:50, estimate: "a lower bound from the timetable, not a reported capture time: Zero plus 5 hours, 20 minutes (BOH p. 304); no source gives an earlier capture" }
      latest: { value: 1917-04-09T11:30, estimate: "Nicholson p. 256: the 1st Division reported the Blue Line 'shortly after eleven o'clock', 'and a little later' the 2nd; BOH gives no time for Thelus and Hill 135 (p. 335); 11:30 taken" }
    - lineId: brown-1cdn
      sectorId: barrage-1cdn
      earliest: { value: 1917-04-09T13:18, estimate: "a lower bound from the timetable, not a reported capture time: the plan had the escarpment 'in Canadian hands by 1:18 p.m.' (Nicholson p. 248; BOH p. 304: Zero plus 7 hours, 48 minutes); BOH p. 336: 'soon after 1 p.m.' the leading companies were still closed up to the barrage on the first belt of wire" }
      latest: { value: 1917-04-09T14:40, source: nicholson-1962, page: "257", note: "'at 2:40, as soon as the capture of the Brown Line seemed assured, General Byng had telephoned the First Army'" }
    - lineId: brown-2cdn
      sectorId: barrage-2cdn
      earliest: { value: 1917-04-09T13:18, estimate: "a lower bound from the timetable, not a reported capture time: the plan's 1:18 p.m. (Nicholson p. 248); no source gives an earlier capture" }
      latest: { value: 1917-04-09T14:40, source: nicholson-1962, page: "257", note: "the Brown Line's capture 'seemed assured' at 2:40" }

