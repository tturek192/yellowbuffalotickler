# Artillery and the fire plan for 9 April 1917: the barrage sector of each attacking division, the artillery park by
# weapon and role, and the counter-battery state at Zero. Research notes: docs/research/vimy/fireplan.md.
#
# Sector y-ranges are the division boundaries at the German front line (Task 7, geometry.md).
# Leg values (Task 10). The engine runs a leg in ceil(depth / liftM) lifts of liftMin minutes each, the depth measured
# at the sector's middle on the digitized lines. Lift distance and pauses are the corps timetable's (Nicholson
# pp. 247-248; BOH pp. 304, 333). liftMin is each leg's timetable time divided by its lifts, so the barrage reaches
# every line at the timetable's minute: Black Zero+35, Red Zero+95, Blue Zero+320, Brown Zero+468 (13:18). It is an
# average, not the guns' lift rate (3 minutes a lift at first, Nicholson p. 253), because a leg has one pause only
# and the timetable also stood on the intermediate trenches (fireplan.md, "Leg values").
sectors:
  - id: barrage-1cdn
    name: 1st Canadian Division barrage sector
    # Division boundary y values: Map 7 battalion arrows, the boundary taken midway between the neighbouring divisions’ outermost arrows at the German front (docs/research/vimy/geometry.md, "Division boundaries").
    yMin: -4650
    yMax: -2980
    startLineId: ger-front
    legs:
      - toLineId: black-1cdn
        liftM: { value: 91.44, source: nicholson-1962, page: "253", note: "'lifted 100 yards every three minutes'; p. 249: 'average lifts of 100 yards'; BOH p. 319: 'hundred-yard lifts'" }
        liftMin: { value: 5, estimate: "the 35 minutes allowed from Zero to the Black Line (Nicholson p. 247; BOH p. 304) over this leg's 7 lifts (567 m, ger-front to black-1cdn at the sector's middle); the guns lifted every 3 minutes (p. 253), the average takes in the opening 3 minutes on the front trench and the standing time on the second and third trenches" }
        pauseMin: { value: 40, source: nicholson-1962, page: "247", note: "'a 40-minute pause' on the Black Line; BOH pp. 304, 322: 'a pause of forty minutes'" }
      - toLineId: red-1cdn
        liftM: { value: 91.44, source: nicholson-1962, page: "253", note: "100-yard lifts" }
        liftMin: { value: 3.333, estimate: "the 20 minutes allowed from the Black to the Red Line (Nicholson p. 247; BOH p. 304: the Red Line at Zero+95) over this leg's 6 lifts (539 m at the sector's middle)" }
        pauseMin: { value: 150, source: nicholson-1962, page: "248", note: "'a pause of two and a half hours on the Red Line'; BOH p. 333: the barrage resumed 'on the stroke of 9.35 a.m.' (Zero+245)" }
      - toLineId: blue-1cdn
        liftM: { value: 91.44, source: boh-1917-1, page: "334", note: "'lifting 100 yards every five minutes' on the 1st and 2nd Divisions' front" }
        liftMin: { value: 5.769, estimate: "from the 9:35 resumption (BOH p. 333) to the Blue Line at Zero+5 h 20 min (BOH p. 304), 75 minutes, over this leg's 13 lifts (1,158 m); BOH p. 334 gives 5 minutes a lift from the Zwischen-Stellung on" }
        pauseMin: { value: 96, source: nicholson-1962, page: "248", note: "'a further halt of 96 minutes' on the Blue Line; Nicholson p. 257 and BOH p. 336 say ninety minutes (fireplan.md, Conflicts)" }
      - toLineId: brown-1cdn
        liftM: { value: 91.44, source: nicholson-1962, page: "253", note: "100-yard lifts" }
        liftMin: { value: 3.714, estimate: "from the end of the 96-minute halt (Zero+416) to the Brown Line at 1:18 p.m., Zero+468 (Nicholson p. 248; BOH p. 304: Zero+7 h 48 min), 52 minutes, over this leg's 14 lifts (1,230 m); BOH p. 336 allows the right battalion half an hour for 800 yards, 3.75 minutes a lift" }
        pauseMin: { value: 0, estimate: "the division's final objective; how long the protective barrage stood beyond it is not in the sources read (fireplan.md, Open questions); 0 ends the barrage on arrival, as in the Plan 1 draft" }
    standOffM: { value: 180, estimate: "about 200 yards; the protective barrage's distance beyond an objective is not in the sources read (fireplan.md, Open questions). BOH p. 325: men who missed the obliterated third trench walked 'into the halted barrage', so it stood close beyond the line; the Plan 1 draft's figure kept" }
  - id: barrage-2cdn
    name: 2nd Canadian Division barrage sector
    # Division boundary y values: Map 7 battalion arrows, the boundary taken midway between the neighbouring divisions’ outermost arrows at the German front (docs/research/vimy/geometry.md, "Division boundaries").
    yMin: -2980
    yMax: -1770
    startLineId: ger-front
    legs:
      - toLineId: black-2cdn
        liftM: { value: 91.44, source: nicholson-1962, page: "253", note: "'lifted 100 yards every three minutes'; BOH p. 319" }
        liftMin: { value: 7, estimate: "the 35 minutes allowed from Zero to the Black Line (Nicholson p. 247; BOH p. 304) over this leg's 5 lifts (404 m at the sector's middle); the guns lifted every 3 minutes (p. 253), the average takes in the opening 3 minutes and the standing time on the intermediate trenches" }
        pauseMin: { value: 40, source: nicholson-1962, page: "247", note: "'a 40-minute pause' on the Black Line; BOH p. 304" }
      - toLineId: red-2cdn
        liftM: { value: 91.44, source: nicholson-1962, page: "253", note: "100-yard lifts" }
        liftMin: { value: 2.857, estimate: "the 20 minutes allowed from the Black to the Red Line (Nicholson p. 247; BOH p. 304) over this leg's 7 lifts (555 m)" }
        pauseMin: { value: 150, source: nicholson-1962, page: "248", note: "'a pause of two and a half hours on the Red Line'; BOH p. 333: resumed at 9.35 a.m." }
      - toLineId: blue-2cdn
        liftM: { value: 91.44, source: boh-1917-1, page: "334", note: "'lifting 100 yards every five minutes'" }
        liftMin: { value: 5, estimate: "from the 9:35 resumption (BOH p. 333) to the Blue Line at Zero+5 h 20 min (BOH p. 304), 75 minutes, over this leg's 15 lifts (1,305 m); it matches BOH p. 334's 5 minutes a lift, which began after a 3-minute pause on the Zwischen-Stellung at 9:55" }
        pauseMin: { value: 96, source: nicholson-1962, page: "248", note: "'a further halt of 96 minutes'; Nicholson p. 257 and BOH p. 336 say ninety (fireplan.md, Conflicts)" }
      - toLineId: brown-2cdn
        liftM: { value: 91.44, source: nicholson-1962, page: "253", note: "100-yard lifts" }
        liftMin: { value: 26, estimate: "52 minutes to the Brown Line at Zero+468 (Nicholson p. 248), as in the 1st Division's sector, over this leg's 2 lifts (179 m): the final barrage lifted 'in successive lifts from right to left' (Nicholson p. 257; BOH p. 336), so the left, where the distance 'tapered off to nothing', waited for the right" }
        pauseMin: { value: 0, estimate: "the division's final objective; the protective barrage's duration is not in the sources read (fireplan.md, Open questions); 0 as in the Plan 1 draft" }
    standOffM: { value: 180, estimate: "about 200 yards; not in the sources read (fireplan.md, Open questions); BOH p. 325: men walked 'into the halted barrage' just beyond an obliterated trench; the Plan 1 draft's figure kept" }
  - id: barrage-3cdn
    name: 3rd Canadian Division barrage sector
    # Division boundary y values: Map 7 battalion arrows, the boundary taken midway between the neighbouring divisions’ outermost arrows at the German front (docs/research/vimy/geometry.md, "Division boundaries").
    yMin: -1770
    yMax: -570
    startLineId: ger-front
    legs:
      - toLineId: black-3cdn
        liftM: { value: 91.44, source: nicholson-1962, page: "253", note: "'lifted 100 yards every three minutes'; BOH p. 319" }
        liftMin: { value: 7, estimate: "the 35 minutes allowed from Zero to the Black Line (Nicholson p. 247; BOH p. 304) over this leg's 5 lifts (437 m at the sector's middle); the guns lifted every 3 minutes (p. 253), the average takes in the opening 3 minutes and the standing time on the intermediate trenches" }
        pauseMin: { value: 40, source: nicholson-1962, page: "247", note: "'a 40-minute pause' on the Black Line; BOH pp. 304, 325" }
      - toLineId: red-3cdn
        liftM: { value: 91.44, source: nicholson-1962, page: "253", note: "100-yard lifts" }
        liftMin: { value: 4, estimate: "the 20 minutes allowed from the Black to the Red Line, the 3rd Division's final objective at Zero+95 (Nicholson p. 247; BOH p. 304), over this leg's 5 lifts (437 m)" }
        pauseMin: { value: 0, estimate: "the Red Line is the division's final objective (Nicholson p. 247); the protective barrage's duration is not in the sources read (fireplan.md, Open questions); 0 as in the Plan 1 draft" }
    standOffM: { value: 180, estimate: "about 200 yards; not in the sources read (fireplan.md, Open questions); BOH p. 325: men of this division pushed on past the obliterated third trench 'into the halted barrage'; the Plan 1 draft's figure kept" }
  - id: barrage-4cdn
    name: 4th Canadian Division barrage sector
    # Division boundary y values: Map 7 battalion arrows, the boundary taken midway between the neighbouring divisions’ outermost arrows at the German front (docs/research/vimy/geometry.md, "Division boundaries").
    # The 9 April barrage only. The 85th and 46th Battalions' evening attack (Zero+750, oob-canadian.yaml) went in without
    # artillery (BOH p. 341), and the 10 April attack on the Hangstellung had the 9 April barrage repeated at 3 p.m.
    # (BOH p. 342); neither fits a sector's one timetable, so both are notes for Plan 3 (fireplan.md).
    yMin: -570
    yMax: 1320
    startLineId: ger-front
    legs:
      - toLineId: black-4cdn
        liftM: { value: 91.44, source: nicholson-1962, page: "253", note: "'lifted 100 yards every three minutes'; BOH p. 319" }
        liftMin: { value: 5.833, estimate: "the 35 minutes allowed from Zero to the Black Line, 'on the summit of Hill 145' (Nicholson p. 247; BOH p. 304), over this leg's 6 lifts (517 m at the sector's middle); the guns lifted every 3 minutes (p. 253); BOH p. 329: the 38th Battalion advanced again 'after a pause of seventeen minutes' on the first trench" }
        pauseMin: { value: 40, source: nicholson-1962, page: "247", note: "'a 40-minute pause' on the Black Line; BOH p. 304" }
      - toLineId: red-4cdn
        liftM: { value: 91.44, source: nicholson-1962, page: "253", note: "100-yard lifts" }
        liftMin: { value: 5, estimate: "the 20 minutes allowed from the Black Line to the Hangstellung, the 4th Division's final objective at Zero+95 (BOH p. 304; Nicholson p. 247), over this leg's 4 lifts (343 m); BOH p. 329: 'At 7 a.m. ... the barrage had moved beyond the German third trench'" }
        pauseMin: { value: 0, estimate: "the Red Line (the Hangstellung) is the division's final objective (BOH p. 304); the protective barrage's duration is not in the sources read (fireplan.md, Open questions); 0 as in the Plan 1 draft" }
    standOffM: { value: 180, estimate: "about 200 yards; not in the sources read (fireplan.md, Open questions); the Plan 1 draft's figure kept" }

# The artillery park supporting the Canadian Corps on 9 April, by weapon and role. The allied counts sum to the park
# total in fireplan.md ("Park total"). Where a count is sourced but its role is inferred, the count's note says so.
#
# Battle details (Plan 3; docs/research/vimy/bombardment.md, "Artillery"); all four fields are optional and left out
# where the sources read say nothing:
# - ammunition: rounds in hand for the battle. Only the field guns have it: 1,300 rounds a gun (hussey-inman-1921 p. 150).
# - observation, for the battle's fire: `map` for fire by the timetable and the barrage map (the creeping and
#   standing barrages, the howitzers' lifts, the machine-gun barrage: BOH p. 319 n.1; boh-1917-appendices App. 15,
#   para. 9) and for the German defensive barrage, fired blind ("Most of the observation posts having been destroyed",
#   BOH p. 320); `aircraft` for counter-battery (No. 16 Squadron's "counter-battery work with the artillery", BOH
#   p. 311; boh-1917-appendices App. 15, para. 7(f)); `forward-observer` for the trench mortars, which fired from the
#   front trenches (BOH p. 314).
# - position, local metres, an estimate for each entry as one point: the field artillery 2,500 yards behind the front
#   line (BOH p. 307: "a maximum distance of 6,500 yards from the guns" to an objective 4,000 yards deep) at the middle
#   of the corps front (y -1665); the heavy artillery 1,000 yards farther back (p. 307: the field line "from 500 to
#   1,500 yards in front of the heavy batteries"); the silent forward batteries at Neuville-St-Vaast (p. 307); the
#   German field guns in the casemates along Farbus Wood and the Bois de la Ville (pp. 305, 336), the heavy guns in the
#   Bois du Goulot, where 21-cm and 15-cm pieces were taken (hussey-inman-1921 p. 154; BOH p. 335). The I Corps and
#   First Army pieces, the mortars and the barrage machine guns have none: their positions are not given, or not one point.
# - horseDrawn: true for the field batteries (the 13-pdrs are horse artillery, RCHA and RHA; the forward move of field
#   batteries, rca-ww1-history; Nicholson p. 249: 50,000 horses in the Corps area) and for the German batteries, whose
#   horses were gassed at Zero (BOH p. 320). Left out for the heavy pieces, horse- or tractor-drawn: not in the sources read.
# Mines blown at Zero (Task 14 fix round): the two on the left, under the German front line opposite the 73rd Battalion
# (BOH pp. 319, 330; Nicholson p. 260). Places and crater size are estimates (bombardment.md, "Mines at Zero"): on the
# German front line (ger-front) across the 73rd's frontage (its companies at y 1036 and 1225, oob-canadian.yaml), one
# near each half; no source read gives where each lay or how big its crater was. Their effect on the garrison ("killed
# a great part", BOH p. 330) is a target, never an input.
mines:
  - id: mine-73bn-right
    side: allied
    at: [-704, 1080]
    firedAfterMin: { value: 0, source: boh-1917-1, page: "319", note: "'On the stroke of 5.30 a.m. ... two mines were exploded on the left of the battle-front under the German front line'" }
    craterRadiusM: { value: 30, estimate: "no source read gives the craters' size (BOH p. 330 names 'Gunner and Kennedy Craters' in No Man's Land, unmeasured); a judgement: a crater some 60 m across" }
    cite:
      value: "one of the two mines fired at Zero under the German front line opposite the 73rd Battalion"
      source: boh-1917-1
      page: "330"
      note: "'Simultaneously with the opening of the bombardment, two mines were fired, which killed a great part of the German garrison in this sector'; Nicholson p. 260: 'Two mines exploded at zero hour killed many of the garrison opposite the 73rd Battalion'. Place an estimate"
  - id: mine-73bn-left
    side: allied
    at: [-707, 1230]
    firedAfterMin: { value: 0, source: boh-1917-1, page: "319", note: "'On the stroke of 5.30 a.m. ... two mines were exploded on the left of the battle-front under the German front line'" }
    craterRadiusM: { value: 30, estimate: "as for mine-73bn-right" }
    cite:
      value: "the other of the two mines fired at Zero under the German front line opposite the 73rd Battalion"
      source: boh-1917-1
      page: "330"
      note: "as for mine-73bn-right; Nicholson p. 260. Place an estimate"

artillery:
  # Canadian Corps field artillery: 30 brigades with 480 18-pdrs and 138 4.5-inch howitzers (BOH p. 307; Nicholson p. 248).
  - id: cdn-18pdr-creeping
    side: allied
    formationId: cdn-corps
    weapon: 18pdr
    role: creeping
    count:
      value: 320
      range: [280, 320]
      sources:
        - { source: boh-1917-1, page: "319 n.1", note: "'fired by two-thirds of the 18-pdr. batteries, about one gun to 25 yards of frontage': two-thirds of 480 is 320" }
        - { source: nicholson-1962, page: "253", note: "'one gun to every 25 yards of front' over the Corps' 'front of 7000 yards' (p. 245) is 280" }
      note: "BOH's two-thirds of the 480 18-pdrs is the working value; one gun to 25 yards gives 280 on Nicholson's 7,000 yards (fireplan.md, Conflicts)"
    ammunition: { value: 416000, estimate: "320 guns x 1,300 rounds: the 5th Division's artillery, attached to the 2nd Canadian Division, stocked 'the vast quantity of ammunition required (1300 rounds per gun)' for the battle (hussey-inman-1921 p. 150), the one per-gun figure found, taken for all the field guns (bombardment.md, Artillery)" }
