# The counter-battery state at Zero: the share of the German guns located, and so engaged, at Zero.
counterBattery:
  side: allied
  suppressedAtZeroFrac:
    value: 0.83
    range: [0.83, 0.86]
    sources:
      - { source: nicholson-1962, page: "251", note: "'Of an estimated 212 guns opposite the Canadian Corps, 83 per cent were located'" }
      - { source: boh-1917-1, page: "314", note: "'86 per cent. of the 212 active German battery positions on and behind the ridge had been correctly located'" }
      - { source: rca-ww1-history, page: "the paragraphs on Vimy Ridge (no headings)", note: "counter-battery fire 'silenced 83% of the German guns'" }
    note: "located is taken as suppressed at Zero: every located battery was bombarded with high explosive and gas at Zero (BOH pp. 319-320). Nicholson counts guns, BOH battery positions. The '85% of 175 located' lead (plan, from the owner's brief) was not found in any source read (fireplan.md, Open questions)"
  note: "Of 212 German guns or battery positions, 83-86% were located before Zero (Nicholson p. 251; BOH p. 314). At Zero all known battery positions were bombarded with HE and gas; gassed horses kept the batteries from moving or getting ammunition up, and the response to the S.O.S. rockets was 'very feeble' (BOH p. 320; Nicholson p. 253)."
