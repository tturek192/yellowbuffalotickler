# Artillery and the fire plan. Task 7 adds one barrage sector per attacking division; Task 10 replaces the leg values
# with researched ones, and adds the artillery. Sector y-ranges are the division boundaries at the German front line
# (geometry.md). Every leg value below is a placeholder copied from the Plan 1 draft, entered as an estimate.
artillery: []
sectors:
  - id: barrage-1cdn
    name: 1st Canadian Division barrage sector
    # Division boundary y values: Map 7 battalion arrows, the boundary taken midway between the neighbouring divisions’ outermost arrows at the German front (docs/research/vimy/geometry.md, "Division boundaries").
    yMin: -4650
    yMax: -2980
    startLineId: ger-front
    legs:
      - toLineId: black-1cdn
        liftM: { value: 91, estimate: "placeholder until Task 10: copied from the Plan 1 draft (1cdn-3bde-draft.yaml), which cites artillery-notes-4 (100 yards)" }
        liftMin: { value: 3, estimate: "placeholder until Task 10: copied from the Plan 1 draft (1cdn-3bde-draft.yaml), which cites artillery-notes-4" }
        pauseMin: { value: 40, estimate: "placeholder until Task 10: copied from the Plan 1 draft (1cdn-3bde-draft.yaml), which cites vimy-brief-2026" }
