# Leaders of both sides. Task 8 entered the allied leaders below; Task 9 adds the German ones.
# Research notes: docs/research/vimy/leaders.md (names, ranks, sources) and docs/research/vimy/leader-rubric.md (what each
# rating means). Every rating is a DRAFT ESTIMATE by the builder, justified from cited conduct; the ratings are the
# owner's to change. A rating of 3 with "no conduct ... found" is a placeholder midpoint, not a judgement.
leaders:
  # First Army. Recorded as a leader only; the scenario has no army formation.
  - id: horne
    name: { value: "Henry Horne", source: "nicholson-1962", page: "247", note: "the text layer reads 'Home', an OCR slip; index p. 602: 'Horne, Gen. Sir H.'" }
    rank: { value: "General", source: "nicholson-1962", page: "247" }
  # Canadian Corps
  - id: byng
    name: { value: "Julian Byng", source: "nicholson-1962", page: "247", note: "'Sir Julian Byng sent General Sir Henry Home a copy of his \"Scheme of Operations\"'" }
    rank: { value: "Lieutenant-General", source: "nicholson-1962", page: "283", note: "'Lieut.-General Sir Julian Byng was taking over the British Third Army' (June 1917)" }
    ratings:
      planning: { value: 5, estimate: "Nicholson p. 247: wrote the corps 'Scheme of Operations' (5 March); p. 250: a full-scale replica of the battle area laid out 'under General Byng's personal direction', rehearsed from platoon to division" }
      orderSpeed: { value: 4, estimate: "pp. 257-258: 'shortly after two o'clock' ordered a squadron to push on to Willerval, and at 2:40 telephoned First Army to propose using cavalry, once the Brown Line 'seemed assured'" }
      adaptiveness: { value: 3, estimate: "p. 258: sought to exploit beyond the plan the same afternoon; but p. 268 calls the corps timetable 'inflexible', and the cavalry had been left out of the scheme (p. 258)" }
      riskTolerance: { value: 3, estimate: "p. 258: the attack was framed as a limited-objective, rigidly timed set-piece; the afternoon cavalry proposal was the one reach beyond it" }
      moraleEffect: { value: 4, estimate: "p. 250: commanders 'at all levels freely briefed their subordinates' so that 'all ranks knew just where they would have to go'; no direct evidence of his personal effect on morale" }
