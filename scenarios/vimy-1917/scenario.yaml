# The Battle of Vimy Ridge, 9-12 April 1917: the whole Canadian Corps front.
# Multi-file scenario: this file holds the frame and the shell; each include holds one topic.
# Research notes for every value: docs/research/vimy/ (start with sources.md).
id: vimy-1917
title: "Vimy Ridge, 9-12 April 1917: Canadian Corps (draft)"
status: draft
include:
  - sources.yaml
  - leaders.yaml
  - oob-canadian.yaml
  - oob-german.yaml
  - fireplan.yaml
  - bombardment.yaml
  - weather.yaml
  - command.yaml
  - historical.yaml
zeroHour:
  value: 1917-04-09T05:30
  source: nicholson-1962
  page: "253"
# The clock every time in the scenario is on: British time, as the sources give it (command.md, "The clock").
utcOffsetMin:
  value: 60
  source: boh-1917-1
  page: "147 n.1"
  note: "'Summer Time had come into use at midnight on the 24th' (of March 1917), so on 9 April the army's clock was GMT plus one hour; BOH gives German times converted, '2.30 a.m. (British time)' (p. 318 n.2). Check: Zero, 5:30, was 'set to coincide with first light' (Nicholson p. 253), and civil dawn at the frame origin on 9 April is 04:35 UTC, 05:35 on this clock"
# The run's time cap: a simulation setting, not a historical value. Spec 12 wants "several times the historical
# length": the battle ran from Zero, 05:30 on 9 April, to the ridge all taken about 08:00 on 12 April (historical
# endedAt, Nicholson p. 263), 4,350 minutes; three times that is 13,050 minutes, to about 11:00 on 18 April. Most runs
# end sooner, on their objectives or on end.lullMin (command.yaml; command.md, "End conditions").
timeLimitMinutes: 13050
geometrySource:
  value: Nicholson 1962 Map 7, georeferenced to IGN BD TOPO road and railway junctions (geometry.md)
  source: nicholson-1962
  page: Map 7 (facing p. 262)
  note: Lines and features digitized off the georeferenced map; every feature carries its own method and accuracy.
geo:
  - geo/lines.geojson
  - geo/features.geojson
terrain: terrain/rge-alti-25m.json
frame:
  # The Canadian National Vimy Memorial on Hill 145 (en.wikipedia.org, rev. 1377286572; see sources.md).
  origin: { lon: 2.7736, lat: 50.3794 }
  bearingDeg:
    value: 75
    estimate: >-
      Measured off Nicholson 1962 Map 7, georeferenced with 17 village GCPs (rms 134 m): the dominant direction of
      the red 9 April attack arrows is 62° (4th Div), 74° (3rd), 87° (2nd) and 75° (1st); mean 74.6°, rounded to 75°.
      Expected error about ±5°; the divisions' arrows fan over 62-87°. Method in docs/research/vimy/sources.md.
  # Local metres (x along the bearing, y to its left). Measured on georeferenced Map 7 (sources.md, geometry.md):
  # Souchez River north of the Pimple (y 3014) to below Farbus Wood (y -4865); the Canadian field and medium
  # batteries west of Carency and Mont-St-Eloi (westernmost battery dot x -5966, geometry.md) to the German Third Line
  # (Oppy-Mericourt line, x 7545). Bounds rounded outward: 13.7 km x 8.2 km.
  extent: { minX: -6000, maxX: 7700, minY: -5000, maxY: 3200 }
lines: []
sectors: []
