# The Battle of Vimy Ridge, 9-12 April 1917: the whole Canadian Corps front.
# Multi-file scenario: this file holds the frame and the shell; each include holds one topic.
# Research notes for every value: docs/research/vimy/ (start with sources.md).
id: vimy-1917
title: "Vimy Ridge, 9-12 April 1917: Canadian Corps (draft)"
status: draft
include:
  - sources.yaml
  - leaders.yaml
  - oob-canadian.yaml
  - oob-german.yaml
  - fireplan.yaml
  - weather.yaml
  - historical.yaml
zeroHour:
  value: 1917-04-09T05:30
  source: nicholson-1962
  page: "253"
# One day of battle; a simulation setting, not a historical value.
timeLimitMinutes: 1440
geometrySource:
  value: Not yet digitized
  estimate: Placeholder until the trench and objective lines are traced from Nicholson Map 7 and the trench maps (a later task)
frame:
  # The Canadian National Vimy Memorial on Hill 145 (en.wikipedia.org, rev. 1377286572; see sources.md).
  origin: { lon: 2.7736, lat: 50.3794 }
  bearingDeg:
    value: 75
    estimate: >-
      Measured off Nicholson 1962 Map 7, georeferenced with 17 village GCPs (rms 134 m): the dominant direction of
      the red 9 April attack arrows is 62° (4th Div), 74° (3rd), 87° (2nd) and 75° (1st); mean 74.6°, rounded to 75°.
      Expected error about ±5°; the divisions' arrows fan over 62-87°. Method in docs/research/vimy/sources.md.
  # Local metres (x along the bearing, y to its left). Measured on georeferenced Map 7 (sources.md):
  # Souchez River north of the Pimple (y 3014) to below Farbus Wood (y -4865); the Canadian assembly area
  # behind Neuville-St Vaast and the 1st Division (x -1840) to the German Third Line (Oppy-Mericourt line, x 7545).
  # Each bound rounded outward by 135-200 m: 9.7 km x 8.2 km.
  extent: { minX: -2000, maxX: 7700, minY: -5000, maxY: 3200 }
lines: []
sectors: []
