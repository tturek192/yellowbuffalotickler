# Canadian Corps order of battle, 9 April 1917, down to company (Task 8). Research notes, sources and every
# estimate's reasoning: docs/research/vimy/oob-canadian.md. Leaders are in leaders.yaml.
#
# Conventions (oob-canadian.md, "Start positions" and "Roles"):
# - Company names end in the letter A-D; where a battalion's sources number or name its companies otherwise, A-D
#   stand for them in the battalion's own order.
# - start is lon/lat (WGS84); the frame projects it. First-wave companies stand 25 m (forward) and 125 m (rear)
#   west of the Canadian front line as digitized (cdn-front); the sources put the forward companies in no man's land
#   (Nicholson p. 252), but the scenario's start line is cdn-front.
# - Battalion frontages: each division's barrage sector split equally among its first-wave battalions, in
#   Nicholson's right-to-left order (an estimate; Map 7's battalion arrows are legible at its scan only for the 2nd
#   Division, whose order they confirm).
# - sectorId barrage-<div> and objectiveLineId <colour>-<div>; the British 13th Brigade attacks under the 2nd
#   Canadian Division and so uses 2cdn ids.
# - reserve companies hold where they stand for the whole run (engine status 'holding').
# - officers and lewisGuns (Plan 3; docs/research/vimy/bombardment.md, "Companies") are not entered: no source read gives
#   a company-specific figure, so the doctrine's companyDefaults (5 officers, 4 Lewis guns: S.S. 143's company in the
#   attack) apply, and the engine lists them in defaultsUsed.
# - training: rehearsed for every Canadian company: "While units and formations were in reserve they rehearsed
#   repeatedly on this model from platoon to divisional level" (Nicholson p. 250; BOH p. 305; the 85th on the taped
#   lines, hayes-1920 p. 46). The British 13th Brigade too: "strenuously practising the attack over taped trenches"
#   (hussey-inman-1921 p. 153). The 15th and 95th Brigades' training before Vimy is not in the sources read, so they
#   have none and take the doctrine's.
