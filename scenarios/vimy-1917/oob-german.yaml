# German order of battle, 9 April 1917, down to company (Task 9): the Sixth Army's two Gruppen opposite the Canadian
# Corps, their three front-line divisions, every front-line company on a mapped trench (garrisons, and the support
# battalions' companies in reserve), and the off-map reserves. Research notes, sources and every estimate's reasoning: docs/research/vimy/oob-german.md. Leaders are in
# leaders.yaml.
#
# Conventions (oob-german.md, "Garrisons"):
# - Regimental zones are bands of y on the German first position, south to north: the 79th Reserve Division's three
#   regiments split its front (D49 Neuville-Thelus road, y -2726, to half the 4th Canadian Division's sector, y 375)
#   equally (1,034 m each); the other regiments take the same width, BIR 14 running on to the end of the mapped trench.
# - Each regiment: a front battalion on the first position, a support battalion on the nearest mapped trench or
#   strongpoint behind it, a resting battalion off the map. Which battalion had which role is a convention (I front,
#   II support, III resting) except where a source names it (comments below). The front battalion's companies are
#   garrisons; the support battalion's are role reserve (Task 12): they stand where they are, up in their trench, held back
#   to counter-attack ground the front battalion loses (oob-german.md, Garrisons).
# - Companies are numbered through the regiment (1-4 in I, 5-8 in II, 9-12 in III); start is lon/lat (the frame
#   projects it) and lies on the feature named by trenchFeatureId (a reserve company's says where it stands). Garrison
#   companies hold for the whole run.
# - machineGuns and dugoutDepthM (Plan 3; docs/research/vimy/bombardment.md, "Garrisons"): the regiment's 18 machine
#   guns spread over its 8 companies in the line; dug-outs 30 feet down, 50 on Hill 145 and at Les Tilleuls. No
#   light machine guns (lewisGuns) are entered: no source read counts the 08/15s at Vimy, so the doctrine default holds.
forces:
  - side: central
    doctrine: de-1917
    formations:
      - id: sixth-army
        name: "Sixth Army (6. Armee)"
        kind: army
        leaderId: falkenhausen
        # Nicholson p. 246: "General von Falkenhausen's Sixth Army, with 20 divisions forward"
        children:
          - id: gruppe-vimy
            name: "Gruppe Vimy (I Bavarian Reserve Corps)"
            kind: group
            leaderId: fasbender
            # BOH p. 197: the 79th Reserve, 1st Bavarian Reserve and 14th Bavarian Divisions "formed the Vimy Group"; the
            # 14th Bavarian held north of the Scarpe, off the map (pp. 276, 353), and is not entered
            children:
              - id: 79rd
                name: "79th Reserve Division"
                kind: division
                leaderId: bacmeister
                # BOH p. 353: its three regiments held "from the cross-roads on Hill 145 to the Thelus-Neuville road"
                children:
                  - id: rir261
                    name: "Reserve Infantry Regiment 261 (RIR 261)"
