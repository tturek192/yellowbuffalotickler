                        companies:
                          - id: rir261-1
                            name: "1./RIR 261"
                            role: garrison
                            trenchFeatureId: ger-first-position
                            strength: { value: 125, estimate: "BOH 1917 I p. 317: the forward two battalions of the five regiments facing the Corps 'at most 5,000 men' = 125 a company (40 companies); rifle strength 'seventy or eighty' (same page; Nicholson p. 247 'about 75'); the owner's brief has about 150 (oob-german.md, Strength)" }
                            paperStrength: { value: 264, source: "vimy-brief-2026", note: "as quoted in the design spec, s. 13: 'about 150 men against 264 on paper'; the brief's own source not seen" }
                            start: { lonLat: [2.770163, 50.373850] }
                            machineGuns: { value: 2.25, estimate: "the regiment's three machine-gun companies, one attached to each battalion (german-handbook-1917 p. 49), of 6 guns each (p. 50): 18 guns over the regiment's 8 companies in the line (its third battalion rested off the map); 1.5 if the resting battalion's company rested with it (bombardment.md, Garrisons)" }
                            dugoutDepthM: { value: 9.1, estimate: "30 feet: BOH p. 316 puts the main German dug-outs and tunnels 'twenty to fifty feet down in the chalk' (6.1-15.2 m), p. 315 deep dug-outs 'about 120 yards apart in the first and second trenches'; these were the older 'deep mined dug-outs' of the front system (p. 353), so the lower half of the range (bombardment.md, Garrisons)" }
