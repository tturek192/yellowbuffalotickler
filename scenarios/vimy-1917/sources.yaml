# The source registry for the Vimy scenario. Every task adds its sources here, never in its own file.
# Tiers: primary, official, scholarly, secondary, tertiary (see docs/research/vimy/sources.md).
sources:
  nicholson-1962:
    title: "Canadian Expeditionary Force 1914-1919: Official History of the Canadian Army in the First World War"
    author: G. W. L. Nicholson
    year: 1962
    url: https://publications.gc.ca/collections/collection_2009/forces/DA3-4462E.pdf
    tier: official
    note: Chapter VIII, The Battle of Vimy Ridge (pp. 233-268), Map 7 and Sketches 37-39; local copy via scripts/fetch-sources.sh
  ign-rge-alti:
    title: RGE ALTI digital elevation model, Géoplateforme altimetry service (resource ign_rge_alti_wld)
    author: IGN (Institut national de l'information géographique et forestière)
    url: https://data.geopf.fr/altimetrie/1.0/calcul/alti/rest/elevation.json
    tier: secondary
    note: "modern 1 m–5 m elevation resampled to 25 m; post-war terrain, including the memorial park; not 1917 micro-relief"
  vimy-brief-2026:
    title: Owner's Vimy research brief (compiles Nicholson, Campbell, the RCA fire-plan essay and others)
    year: 2026
    tier: secondary
  artillery-notes-4:
    title: Artillery Notes No. 4, as quoted in the brief
    tier: primary
  ign-bdtopo:
    title: BD TOPO V3 road and railway sections (troncon_de_route, troncon_de_voie_ferree), Géoplateforme WFS
    author: IGN (Institut national de l'information géographique et forestière)
    url: https://data.geopf.fr/wfs/ows
    tier: secondary
    note: "modern centrelines (fetched 2026-11-20); the ground control points that georeference Map 7 are their junctions, matched to the same roads on the 1917 map (docs/research/vimy/geometry.md)"
  hussey-inman-1921:
    title: The Fifth Division in the Great War
    author: A. H. Hussey and D. S. Inman
    year: 1921
    url: https://archive.org/details/fifthdivisioning00huss
    tier: secondary
    note: "divisional history by two of its officers (Hussey was its CRA); ch. VIII, Vimy Ridge (pp. 151-157), the 13th Brigade with the 2nd Canadian Division; Appendix II (p. 267), commanders by year. Local text via scripts/fetch-sources.sh"
  mcevoy-finlay-1920:
    title: History of the 72nd Canadian Infantry Battalion, Seaforth Highlanders of Canada
    author: Bernard McEvoy and A. H. Finlay
    year: 1920
    url: https://archive.org/details/72seaforthhigh00mcevuoft
    tier: secondary
    note: "battalion history; Vimy Ridge pp. 46-50, with the battalion's strength on the eve of the attack (p. 46)"
  hayes-1920:
    title: The Eighty-Fifth in France and Flanders (85th Canadian Infantry Battalion, Nova Scotia Highlanders)
    author: Joseph Hayes
    year: 1920
    url: https://archive.org/details/eightyfifthinfra00hayeuoft
    tier: secondary
    note: "battalion history by its chaplain; ch. III, Vimy Ridge (pp. 47-54): the battalion's reserve role, and the evening attack by C and D Companies"
  holland-1918:
    title: The Story of the Tenth Canadian Battalion, 1914-1917
    author: J. A. Holland
    year: 1918
    url: https://archive.org/details/tenthbattalion00holluoft
    tier: secondary
    note: "short battalion history; Vimy pp. 28-29 (its commanding officer and its two objectives)"
  wikipedia-vimy-oob:
    title: Battle of Vimy Ridge order of battle (English Wikipedia, revision 1283223092, 31 March 2025)
    url: https://en.wikipedia.org/w/index.php?oldid=1283223092
    tier: tertiary
    note: "unit lists and commanders per brigade, mostly uncited at row level; used as a lead and for battalions no higher-tier source read lists (the 60th Battalion; the British brigades' full battalion titles)"
  wikipedia-cef-battalions:
    title: English Wikipedia articles on CEF infantry battalions (lists of commanding officers with dates)
    tier: tertiary
    note: "each citation's page names the article and the revision read (fetched 2026-11-20); the lists mostly cite Meek, Over the Top! (1971), which was not itself read"
  boh-1917-1:
    title: "Military Operations, France and Belgium, 1917: The German Retreat to the Hindenburg Line and the Battles of Arras"
    author: Cyril Falls
    year: 1940
    url: https://archive.org/details/in.ernet.dli.2015.210683
    tier: official
    note: "the British official history (Task 9); ch. XI-XIII, Vimy Ridge (about pp. 300-356), with Notes on the German side drawn from 'Die Osterschlacht bei Arras' and German regimental histories (p. 352 n.2); local OCR text via scripts/fetch-sources.sh; the printed page numbers are cited, some of which the OCR misreads (388 for 338)"
  aef-251-divisions:
    title: "Histories of Two Hundred and Fifty-One Divisions of the German Army which Participated in the War (1914-1918)"
    author: Intelligence Section of the General Staff, American Expeditionary Forces
    year: 1920
    url: https://archive.org/details/historiesoftwohu00unit
    tier: primary
    note: "compiled in 1919 from Allied wartime intelligence (prisoners, documents), cited by Nicholson p. 247 n.45; each division's composition in 1917 and its movements; Allied intelligence, not German records. Local OCR text via scripts/fetch-sources.sh; the composition tables are garbled in the OCR"
  ign-bdtopo-habitation:
    title: BD TOPO V3 settlement areas (zone_d_habitation), Géoplateforme WFS
    author: IGN (Institut national de l'information géographique et forestière)
    url: https://data.geopf.fr/wfs/ows
    tier: secondary
    note: "modern built-up areas (fetched 2026-11-20); a village's position is the mean of its outline's vertices, good to a few hundred metres for the 1917 village (Task 9 reserve distances)"
  wikipedia-de-german-army:
    title: German Wikipedia articles on the German divisions and commanders at Vimy
    tier: tertiary
    note: "each citation's page names the article and the revision read (fetched 2026-11-20); commanders' names, ranks and dates, mostly citing Wegner, Stellenbesetzung der Deutschen Heere (1990), which was not read"
  wikipedia-en-places:
    title: English Wikipedia articles on places outside France (coordinates)
    tier: tertiary
    note: "each citation's page names the article and the revision read (fetched 2026-11-20); used for Tournai, which IGN's French data does not cover"
  rca-ww1-history:
    title: "The First World War 1914-18 (The Royal Regiment of Canadian Artillery, heritage pages)"
    author: The Royal Regiment of Canadian Artillery
    url: https://rca-arc.org/part0120-the-first-world-war-1914-18/
    tier: secondary
    note: "the regiment's own history page, unsigned and without notes (fetched 2026-11-20); its Vimy section gives the Corps heavy artillery by battery and group, the 13-pdrs and 9.45-inch mortars, and 'silenced 83%' (Task 10, fireplan.md). Local copy via scripts/fetch-sources.sh"
  boh-1917-appendices:
    title: "Military Operations, France and Belgium, 1917: Appendices (to the volume on the German Retreat and the Battles of Arras)"
    author: Cyril Falls
    year: 1940
    url: https://archive.org/details/in.ernet.dli.2015.210681
    tier: official
    note: "the official history's appendices volume (Plan 3, the bombardment): Appendix 11, the First Army plan of 31 January 1917; Appendix 15, the First Army Artillery Plan of 8 February 1917 (counter-battery, wire, the preliminary bombardment); Appendix 52, First Army statistics. Cited by appendix and paragraph; local OCR text via scripts/fetch-sources.sh"
  german-handbook-1917:
    title: "Handbook of the German Army in War, January 1917"
    author: General Staff, War Office (Great Britain)
    year: 1917
    url: https://archive.org/details/hndbkgermanarmy-1917jan
    tier: primary
    note: "British intelligence handbook (also in tables/sources.yaml): three machine-gun companies a regiment, one attached to each battalion (p. 49), of 6 guns (p. 50). Page numbers are the book's"
