historical:
  # Task 10: the 1st Canadian Division's line times from the official histories (docs/research/vimy/historical.md,
  # "The Plan 1 draft's estimates"); the schematic lines stand for the division's Black, Red, Blue and Brown Lines.
  objectives:
    - lineId: black
      sectorId: 1cdn-3bde
      earliest:
        value: 1917-04-09T06:05
        source: boh-1917-1
        page: "322"
        note: "'by 6.5 a.m. ... the 1st Canadian Division was in possession of the Zwölfer-Graben, its first objective'"
      latest:
        value: 1917-04-09T06:15
        source: nicholson-1962
        page: "254"
        note: "'Both the 1st and 2nd Divisions were reported at the Black Line by 6:15'"
    - lineId: red
      sectorId: 1cdn-3bde
      earliest:
        value: 1917-04-09T07:05
        source: boh-1917-1
        page: "323"
        note: "'Shortly after 7 a.m. the division had taken its second objective', less 500 yards on the right"
      latest:
        value: 1917-04-09T08:00
        source: nicholson-1962
        page: "255"
        note: "'By eight o'clock the 1st and 2nd Divisions were reported on the Red Line'"
    - lineId: blue
      sectorId: 1cdn-3bde
      earliest:
        value: 1917-04-09T10:50
        source: boh-1917-1
        page: "304"
        note: "the timetable: the third objective 'to be concluded at Zero plus 5 hours, 20 minutes'"
      latest:
        value: 1917-04-09T11:15
        source: boh-1917-1
        page: "334"
        note: "'By 11.15 a.m. the brigade [the 1st] had reached the Roclincourt—Vimy track'"
    - lineId: brown
      sectorId: 1cdn-3bde
      earliest:
        value: 1917-04-09T13:18
        source: nicholson-1962
        page: "248"
        note: "the timetable: the eastern escarpment 'in Canadian hands by 1:18 p.m.'"
      latest:
        value: 1917-04-09T14:40
        source: nicholson-1962
        page: "257"
        note: "'at 2:40, as soon as the capture of the Brown Line seemed assured'"
