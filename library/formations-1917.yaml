# Divisions of 1917 from other sectors of the Western Front, complete to companies, for a what-if to add to a scenario
# with `add-formation` (it comes in as an off-map reserve: every company a reserve at the op's entry point, so the
# `start` here is a placeholder the op replaces). Research notes, with each division's sources, membership and the
# reasoning of every estimate: docs/research/library/leaders.md ("The divisions"). Leaders: leaders-1917.yaml.
#
# leaders.md ("The divisions") lists what this file holds, division by division; keep the two in step.
# - Ids: British divisions bef-<n>div, German de-<n>div (de-9rd: 9th Reserve). Battalions <division>-<battalion>,
#   companies A-D; German regiments <division>-<regiment>, battalions -i, -ii, -iii, companies numbered through the
#   regiment, 1-4 in the I Battalion, 5-8 in the II, 9-12 in the III (as in the Vimy scenario's German order of battle).
# - Battalion names as the source prints them. Pioneer battalions, machine-gun companies and the artillery are not entered.
# - strength: every company an estimate (leaders.md, "Strength"); no source read gives a 1917 company figure for these units.
sources:
  aef-251-divisions:
    title: "Histories of Two Hundred and Fifty-One Divisions of the German Army which Participated in the War (1914-1918)"
    author: "General Staff, American Expeditionary Forces (G-2)"
    year: 1920
    url: https://archive.org/details/historiesoftwohu00unit
    tier: primary
    note: "compiled from Allied intelligence, not German records; each division's regiments and its 1917 service. The composition tables are illegible in the OCR text; the regiments are read from the narrative. Printed page numbers are cited; local OCR text via scripts/fetch-sources.sh"
  ewing-1921:
    title: "The History of the 9th (Scottish) Division, 1914-1919"
    author: John Ewing
    year: 1921
    url: https://archive.org/details/9thscottishdivision-19141919
    tier: secondary
    note: "divisional history; Appendix I, the order of battle with each battalion's dates of joining and leaving (pp. 397-399). Local OCR text via scripts/fetch-sources.sh"
  stewart-buchan-1926:
    title: "The Fifteenth (Scottish) Division, 1914-1919"
    author: J. Stewart and John Buchan
    year: 1926
    url: https://archive.org/details/fifteenthscottishdivision-19141919
    tier: secondary
    note: "divisional history; Appendix A, the order of battle with transfers and amalgamations (pp. 285-288). Local OCR text via scripts/fetch-sources.sh"
  shakespear-1921:
    title: "The Thirty-Fourth Division, 1915-1919: The Story of its Career from Ripon to the Rhine"
    author: J. Shakespear
    year: 1921
    url: https://archive.org/details/thirtyfourthdivision19151919
    tier: secondary
    note: "divisional history; the units as raised (pp. 2-4) and the Battle of Arras (chs. VI-VII, pp. 95-132). Local OCR text via scripts/fetch-sources.sh"
  bewsher-1921:
    title: "The History of the 51st (Highland) Division, 1914-1918"
    author: F. W. Bewsher
    year: 1921
    url: https://archive.org/details/historyof51sthig00bews
    tier: secondary
    note: "divisional history; the Battles of Arras, April-May 1917 (chs. IX-X, pp. 138-192). Local OCR text via scripts/fetch-sources.sh"
  wyrall-1924-62nd:
    title: "The History of the 62nd (West Riding) Division, 1914-1919, vol. I"
    author: Everard Wyrall
    year: 1924
    url: https://archive.org/details/62nddivisionvol1
    tier: secondary
    note: "divisional history; Appendix I, the order of battle on arrival in France, January 1917 (pp. 239-241). Local OCR text via scripts/fetch-sources.sh"
