# Weather presets for a what-if (`{ op: weather, preset: <id> }`): each a timeline of entries `afterMin` minutes
# after the battle's Zero (negative: before), which the op turns into dated entries for the scenario it is applied to.
# Each spans five days, from the evening before Zero to the evening of the fourth day after it (-720 to 6510), so it
# fits any battle of at least that length; Vimy's runs to Zero + 13050. Research notes: docs/research/library/weather.md.
#
# Every value is an ESTIMATE: no source gives the weather of a battle not fought in it. Each names the documented day
# it resembles and quotes what the source says of it; where the source is silent (a wind, a visibility figure, any
# temperature) it says so. Entries: the evening before (17:30 for a 05:30 Zero), then each day at dawn (Zero), late
# morning (Zero + 330) and evening (Zero + 750). weather.md lists the same values; keep the two in step.
weatherPresets:
  # Fine, dry spring days; like mid-March 1917 in the advance to the Hindenburg Line (BOH 1917 I p. 140) and 28 April at Arras (p. 413).
  dry-spring:
