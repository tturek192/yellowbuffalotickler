      windFromDeg: { value: 240, estimate: "no wind in the sources for the day it resembles; the builder's estimate: a light south-westerly" }
      visibilityM: { value: 10000, estimate: "no visibility figure in the sources for the day it resembles; the builder's estimate: clear air on a fine evening" }
