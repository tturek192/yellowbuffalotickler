      adaptiveness: { value: 4, estimate: "BOH 1917 III p. 141: when his Group's front was extended to Bourlon Wood he named the 21st Reserve Division his counter-attack division and asked for the 3rd Guard; p. 138 n.: entrenched the railway behind the Bourlon ridge" }
      riskTolerance: { value: 5, estimate: "BOH 1917 I p. 376: proposed the Lagnicourt counter-stroke himself with four divisions; p. 477 n.: protested being made to wait, wanting to attack while the 3rd Guard Division was fresh" }
